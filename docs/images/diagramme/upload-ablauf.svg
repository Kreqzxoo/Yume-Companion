<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">Ablauf der Veröffentlichung auf GitHub</title>
  <desc id="d">Fünf Schritte: Ordner prüfen, Repository anlegen, Dateien hochladen, Release mit Installer und APK anlegen, Update-Prüfung in der App eintragen.</desc>
  <defs><style>
    .bg{fill:#17111f}.b{fill:#251b36;stroke:#ff8fc7;stroke-width:1.5}.n{font:700 22px Segoe UI,Arial,sans-serif;fill:#ffc2e2}
    .t{font:600 15px Segoe UI,Arial,sans-serif;fill:#f3ecf7}.s{font:12.5px Segoe UI,Arial,sans-serif;fill:#c9bde0}.h{font:700 20px Segoe UI,Arial,sans-serif;fill:#ffc2e2}.ln{stroke:#b69cff;stroke-width:2;fill:none}.ar{fill:#b69cff}
  </style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" class="ar"/></marker></defs>
  <rect class="bg" width="960" height="300" rx="18"/>
  <text x="480" y="40" text-anchor="middle" class="h">Von deinem PC auf GitHub</text>
  <rect class="b" x="24" y="70" width="162" height="170" rx="14"/><text x="105" y="104" text-anchor="middle" class="n">1</text><text x="105" y="134" text-anchor="middle" class="t">Ordner prüfen</text><text x="105" y="160" text-anchor="middle" class="s">check_upload.ps1</text><text x="105" y="180" text-anchor="middle" class="s">keine Schlüssel,</text><text x="105" y="198" text-anchor="middle" class="s">keine Chats</text>
  <rect class="b" x="212" y="70" width="162" height="170" rx="14"/><text x="293" y="104" text-anchor="middle" class="n">2</text><text x="293" y="134" text-anchor="middle" class="t">Repo anlegen</text><text x="293" y="160" text-anchor="middle" class="s">öffentlich (GPL-3.0)</text><text x="293" y="180" text-anchor="middle" class="s">GitHub Desktop</text><text x="293" y="198" text-anchor="middle" class="s">oder gh / git</text>
  <rect class="b" x="400" y="70" width="162" height="170" rx="14"/><text x="481" y="104" text-anchor="middle" class="n">3</text><text x="481" y="134" text-anchor="middle" class="t">Hochladen</text><text x="481" y="160" text-anchor="middle" class="s">Commit + Push</text><text x="481" y="180" text-anchor="middle" class="s">Quelltext, Doku,</text><text x="481" y="198" text-anchor="middle" class="s">Android, LLM-Server</text>
  <rect class="b" x="588" y="70" width="162" height="170" rx="14"/><text x="669" y="104" text-anchor="middle" class="n">4</text><text x="669" y="134" text-anchor="middle" class="t">Release</text><text x="669" y="160" text-anchor="middle" class="s">Setup.exe (unter 2 GiB)</text><text x="669" y="180" text-anchor="middle" class="s">APK, LLM-Setup,</text><text x="669" y="198" text-anchor="middle" class="s">Prüfsummen</text>
  <rect class="b" x="776" y="70" width="162" height="170" rx="14"/><text x="857" y="104" text-anchor="middle" class="n">5</text><text x="857" y="134" text-anchor="middle" class="t">Update-Prüfung</text><text x="857" y="160" text-anchor="middle" class="s">in der App:</text><text x="857" y="180" text-anchor="middle" class="s">Einstellungen →</text><text x="857" y="198" text-anchor="middle" class="s">Updates → Repo</text>
  <path class="ln" d="M188 155 L210 155" marker-end="url(#a)"/><path class="ln" d="M376 155 L398 155" marker-end="url(#a)"/><path class="ln" d="M564 155 L586 155" marker-end="url(#a)"/><path class="ln" d="M752 155 L774 155" marker-end="url(#a)"/>
</svg>
