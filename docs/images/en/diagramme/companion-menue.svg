<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">The right-click menu of the desktop companion</title>
  <desc id="d">Schematic: on the left the character on the desktop with the hormone display, on the right the menu with quick actions, microphone, petting, animations, modes, size and sleep.</desc>
  <defs><style>
    .bg{fill:#17111f}.m{fill:#251b36;stroke:#ff8fc7;stroke-width:1.5}.f{fill:#33224a;stroke:#b69cff;stroke-width:2}
    .t{font:600 15px Segoe UI,Arial,sans-serif;fill:#f3ecf7}.s{font:13px Segoe UI,Arial,sans-serif;fill:#c9bde0}.h{font:700 20px Segoe UI,Arial,sans-serif;fill:#ffc2e2}
    .ln{stroke:#b69cff;stroke-width:1.5;fill:none}.bar{fill:#ff8fc7}.bg2{fill:#3a2b52}
  </style></defs>
  <rect class="bg" width="960" height="600" rx="18"/>
  <text x="480" y="36" text-anchor="middle" class="h">Desktop companion: character and right-click menu</text>

  <!-- Figur -->
  <rect class="f" x="40" y="70" width="250" height="470" rx="16"/>
  <circle cx="165" cy="210" r="62" fill="#b088eb"/><rect x="115" y="260" width="100" height="150" rx="40" fill="#5f50be"/>
  <circle cx="145" cy="205" r="9" fill="#2a2140"/><circle cx="185" cy="205" r="9" fill="#2a2140"/>
  <text x="165" y="450" text-anchor="middle" class="t">Character (image, Live2D or VRM)</text>
  <text x="165" y="472" text-anchor="middle" class="s">floats above other windows</text>
  <text x="165" y="494" text-anchor="middle" class="s">follows the mouse pointer with her eyes</text>
  <!-- HUD -->
  <rect class="m" x="60" y="86" width="210" height="64" rx="10"/>
  <text x="70" y="104" class="s">🧪 Oxytocin</text><rect class="bg2" x="150" y="96" width="110" height="8" rx="4"/><rect class="bar" x="150" y="96" width="72" height="8" rx="4"/>
  <text x="70" y="120" class="s">⚡ Dopamine</text><rect class="bg2" x="150" y="112" width="110" height="8" rx="4"/><rect class="bar" x="150" y="112" width="58" height="8" rx="4"/>
  <text x="70" y="136" class="s">🔥 Cortisol</text><rect class="bg2" x="150" y="128" width="110" height="8" rx="4"/><rect class="bar" x="150" y="128" width="26" height="8" rx="4"/>
  <text x="70" y="148" class="s" style="font-size:10px">🔋 Energy (hormone display)</text>

  <!-- Menü -->
  <path class="ln" d="M292 300 L330 300"/>
  <rect class="m" x="330" y="64" width="590" height="500" rx="14"/>
  <g class="t">
    <text x="352" y="96">⚡ Quick actions</text>
    <text x="372" y="118" class="s">📸 Look at my screen (vision) · 📋 Read clipboard · 🧠 What is on my mind?</text>
    <text x="352" y="150">Microphone on/off</text>
    <text x="352" y="178">🤚 Pet</text>
    <text x="352" y="206">🎭 Play animation · Movements</text>
    <text x="352" y="240">Switches</text>
    <text x="372" y="262" class="s">👁‍🗨 Click-through mode · 📌 Always on top · 👁 Gaze tracking</text>
    <text x="372" y="284" class="s">💬 Window reactions · 📝 Subtitles · 💬 Text chat bar (on hover / on / off)</text>
    <text x="372" y="306" class="s">🧠 Thought notepad · 📊 Hormone display</text>
    <text x="352" y="340">Settings</text>
    <text x="372" y="362" class="s">Proactive interval: 3 · 5 · 10 · 15 · 30 · 60 minutes</text>
    <text x="372" y="384" class="s">Tracking speed: slow · normal · fast</text>
    <text x="372" y="406" class="s">📐 Model size: small 200×300 · medium 400×600 · large 600×900</text>
    <text x="352" y="440">📍 Centre on screen · 🔄 Reset size</text>
    <text x="352" y="472">Sleep · Hide</text>
  </g>
  <text x="352" y="520" class="s">Risky actions (clicks, typing, scripts, programs) appear as an</text>
  <text x="352" y="540" class="s">approval banner “Allow / Deny” with a countdown.</text>
</svg>
