name: Prüfung

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python-Syntax aller Dateien
        run: python -m compileall -q main.py app tools tests
      - name: Upload-Prüfung (Geheimnisse, große Dateien)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools\dev\check_upload.ps1 -UseGit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dokumentation prüfen (Links, Bilder)
        run: python tools/dev/check_docs.py || true

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android-SDK pruefen (auf dem Runner vorinstalliert)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit-Tests der Android-App
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Debug-APK bauen
        run: gradle --no-daemon :app:assembleDebug
