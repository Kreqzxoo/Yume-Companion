pair_title: "Подключение телефона (Yume Companion для Android)"
pair_hint: "1. Установите APK на телефон (кнопка «Сохранить APK»).  2. Откройте приложение → «Подключить по QR-коду».  3. Отсканируйте этот код. Код действует несколько минут и только один раз – он постоянно обновляется. После этого телефон получает собственный ключ, который можно отозвать в любой момент. Приложение само определяет, подключаться ли через домашнюю сеть (локальный адрес) или в пути (внешний домен, если указан)."
