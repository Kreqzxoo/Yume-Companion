tts_notice_title: 💡 Информация перед первым запуском озвучки
tts_notice_first_run_text: 'Обратите внимание: перед первым использованием голосовых движков <b>XTTSv2</b>, <b>Kokoro</b>,
  <b>Silero</b> или <b>Qwen 3 TTS</b> программа автоматически скачает необходимые файлы и веса выбранной нейросети. Вы
  можете увидеть прогресс загрузки модели в консоли.<br><br>После завершения первой загрузки вы сможете свободно и мгновенно
  использовать озвучку без повторных скачиваний.'
