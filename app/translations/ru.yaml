about_program_title: О Yume Companion
about_program_description: <b>Yume Companion</b> — это бесплатная десктопная программа с открытым исходным кодом, в которой
  ИИ-персонажи действительно помнят, развиваются и живут внутри программы или вне её на рабочем столе. Создайте или импортируйте
  персонажа один раз и взаимодействуйте с ним сквозь три взаимосвязанных измерения:<br><br>• 💬 <b>Интерактивный текстовый
  и голосовой чат:</b> Живой диалог 1-на-1 с анимированными Live2D/VRM аватарами, потоковой озвучкой, адаптивным HUD
  статусов, прикреплением файлов и использованием инструментов.<br><br>• 🎲 <b>Ролевой движок Yume Stage:</b> Настольные
  текстовые RPG под управлением ИИ-Мастера Игры с отслеживанием состояния мира, инвентаря и динамическими NPC.<br><br>•
  🖥️ <b>Спутник Yume Desktop Companion:</b> Автономный персонаж на рабочем столе с нейрогормональной моделью настроения, зрением,
  чтением буфера и вызовом инструментов.<br><br>Все измерения объединены модулем <b>Yume Memory</b> — когнитивной памятью
  с эмоциональной эволюцией, личным дневником и авто-исправлением противоречий. Работает 100% локально и приватно на
  вашем ПК через GGUF (CUDA, Vulkan, HIP, SYCL) без фильтров и подписок, с поддержкой облачных API, Discord и локального
  веб-клиента.
