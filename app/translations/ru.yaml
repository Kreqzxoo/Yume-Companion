  и слабости. Можно списком через запятую или короткими фразами.'
ai_asst_field_scenario_label: Сценарий (обстановка)
ai_asst_field_scenario_hint: Описание текущей ситуации/места/контекста, в котором начинается ролевая игра между персонажем
  и {{user}}. 2-4 предложения.
ai_asst_field_first_message_label: Первое сообщение
ai_asst_field_first_message_hint: Первая реплика персонажа, адресованная {{user}}, от первого лица, в характере персонажа.
  Действия оформляй в *звёздочках*, реплики — обычным текстом. Атмосферно, живо, без спойлеров о будущем сюжете.
ai_asst_field_alt_greetings_label: Альтернативные приветствия
ai_asst_field_alt_greetings_hint: Список из 2-3 АЛЬТЕРНАТИВНЫХ первых сообщений (другие завязки/настроения), в том же
  стиле, что и основное первое сообщение. Верни как массив строк JSON.
ai_asst_field_example_messages_label: Примеры диалогов
ai_asst_field_example_messages_hint: '1-2 коротких примера обмена репликами между {{user}} и персонажем, демонстрирующих
  стиль речи персонажа. Формат:

  {{user}}: ...

  {{char}}: ...

  (пустая строка)

  {{user}}: ...

  {{char}}: ...'
ai_asst_field_creator_notes_label: Заметки автора
