provider_desc_local: Запуск моделей полностью офлайн с максимальной приватностью и без цензуры
provider_desc_openai: Передовое качество и надежность генерации для текстовых ролевых игр
provider_desc_anthropic: Лучший в своем классе литературный слог, последовательность характера и эмоциональная глубина
provider_desc_gemini: Огромное контекстное окно (1M+ токенов) — идеально для длинных историй и многотомных саг
provider_desc_deepseek: Сверхпродуктивная и экономичная модель с лучшим соотношением цены и качества генерации
provider_desc_grok: Меньше цензуры, больше остроумия и креативности — отлично для свободных ролевых игр
provider_desc_qwen: Мощные многоязычные рассуждения и отличные повествовательные способности
provider_desc_zai: Быстрая, связная речь и превосходное художественное повествование — сильная альтернатива Claude
provider_desc_mistral: Высокопроизводительные открытые модели с превосходным балансом скорости и качества
provider_desc_openrouter: Доступ к сотням лучших мировых моделей в одном месте — ультимативный агрегатор
provider_desc_player2: Бесплатный доступ к языковым моделям через приложение Player2. API-ключ не нужен — просто держите
  приложение Player2 запущенным.
