tool_web_title: WebSearchTool
tool_web_desc: Поиск в сети через скрытый API DuckDuckGo для получения актуальных фактов, погоды или новостей в реальном
  времени.
tool_browse_web_title: BrowserAgentTool [Playwright]
tool_browse_web_desc: Автономный веб-серфинг через Chromium. Читает чистый текст страниц, нажимает кнопки, заполняет
  формы и скачивает файлы в песочницу.
tool_gui_action_title: GUIActionTool [Computer Use]
tool_gui_action_desc: 'Прямое управление интерфейсом ОС: перемещение курсора, клики мыши, ввод текста, скроллинг окон
  и нажатие горячих клавиш (Ctrl+S, Enter и др.).'
tool_execute_code_title: ExecuteCodeTool [Code Interpreter]
tool_execute_code_desc: Написание и запуск скриптов на Python и PowerShell в изолированной локальной песочнице для вычислений,
  обработки файлов и парсинга.
tool_file_organizer_title: FileOrganizerTool [Workspace Manager]
tool_file_organizer_desc: Просмотр содержимого рабочего стола и папок (ярлыки .lnk, папки, файлы), поиск файлов и автоматическая
  сортировка файлов по категориям.
tool_planner_title: TaskPlannerTool [Иерархический планировщик]
tool_planner_desc: Разбивает сложные составные задачи пользователя на упорядоченные цепочки вызовов инструментов и последовательно
  выполняет их.
tool_app_control_title: AppControlTool
tool_app_control_desc: 'Управление приложениями и ярлыками: запуск программ, открытие системных папок/Корзины, фокус
  окон или завершение процессов.'
tool_env_snapshot_title: SystemVitalsMonitorTool [Hardware Watchdog]
tool_env_snapshot_desc: Мониторинг железа в реальном времени и фоновый вотчдог, предупреждающий о низком заряде батареи,
  перегреве GPU или завершении загрузок.
tool_hardware_specs_title: GetHardwareSpecsTool
tool_hardware_specs_desc: Получение подробных характеристик ПК (CPU, RAM, GPU, VRAM, накопители) для оценки совместимости
  с играми и локальными нейросетями.
tool_read_clipboard_title: ClipboardReaderTool
tool_read_clipboard_desc: Чтение текущего текстового содержимого системного буфера обмена для анализа и ответов на вопросы.
tool_url_title: OpenURLTool
tool_url_desc: Открытие ссылок и веб-сайтов (например, YouTube или GitHub) в браузере по умолчанию по вашей просьбе.
tool_sysinfo_title: GetSystemInfoTool
tool_sysinfo_desc: Получение точного системного времени, даты и дня недели для ориентации спутника в текущем расписании.
tool_media_title: MediaControlTool
tool_media_desc: Управление системным воспроизведением медиа на ПК (пауза, плей, переключение треков в Spotify, YouTube
  или плеере).
tool_vision_title: TakeScreenshotTool [Зрение]
tool_vision_desc: Анализ происходящего на экране. Делает быстрый снимок и отправляет его мультимодальной нейросети. Очень
  ресурсоёмко!
