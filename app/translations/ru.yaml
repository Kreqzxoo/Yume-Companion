sm_mode_full_tooltip: '<b>🌌 Полная Синхронизация</b><br><br>

  Полная когнитивная связь. Активирован каждый аспект персонажа:<br><br>

  • <b>Психологический индекс:</b> Отслеживание настроения в реальном времени.<br>

  • <b>Темы лора:</b> Глубокая проработка мира и фактов персонажа.<br>

  • <b>Дневники:</b> Эмоциональные размышления от первого лица.<br><br>

  <i>Максимальное погружение. Требует мощной системы или API.</i>'
sm_mode_soul_link_tooltip: '<b>🔗 Связь Души</b><br><br>

  Фокус на личности и чувствах.<br><br>

  • Обновляет индекс <b>MEMORY.md</b>, чтобы сохранять настроение и цели персонажа.<br>

  • <b>Агент-Дневник</b> записывает его мысли о вас в файл дневника.<br><br>

  <b>Что отключено:</b> Система не тратит ресурсы на создание или обновление энциклопедии (Топиков).<br><br>

  <i>Лучший выбор для: Поддержания глубокой связи без лишней нагрузки на ПК.</i>'
sm_mode_mind_spark_tooltip: '<b>⚡ Искра Разума</b><br><br>

  Тактическая память для максимальной скорости.<br><br>

  • Обновляет <b>ТОЛЬКО</b> психологический индекс <b>MEMORY.md</b>.<br><br>

  Гарантирует, что персонаж помнит, кто он, что чувствует и чего хочет прямо сейчас.<br><br>

  <b>Что отключено:</b> Дневники и записи о мире не генерируются.<br><br>

  <i>Лучший выбор для: Слабых систем или динамичного экшен-РП.</i>'
sm_mode_reflection_flow_tooltip: '<b>📓 Поток Рефлексии</b><br><br>

  Эмоциональный лог с около-нулевым влиянием на скорость диалога.<br><br>

  • Активен только <b>Агент-Дневник</b>.<br><br>

  Персонаж не меняет свое состояние "в моменте", но подводит эмоциональный итог общения с вами.<br><br>

  <b>Что отключено:</b> Никаких правок в индексе или лоре.<br><br>

  <i>Лучший выбор для: Максимальной плавности чата при сохранении истории чувств.</i>'
ambient_sound_tooltip: "<b>\U0001F3B5 Модуль Эмбиента</b><br><br>\n\nЭта функция добавляет <b>атмосферное звуковое сопровождение</b>\
  \ при входе в чат с персонажем.<br><br>\nПосле включения вы можете выбрать подходящий <b>эмбиент</b> — фоновую музыку\
  \ или звуки, которые создадут нужное настроение: \nбудь то шумный ветер, стук каплей дождя или уютный треск костра.<br><br>\n\
  \n<b>Пример:</b><br>\nЕсли вы общаетесь с персонажем в <i>Таверне</i>, \nвы можете выбрать эмбиент с <i>звуками шумной\
  \ толпы и веселой мелодией</i>, \nчтобы погрузиться в атмосферу заведения и усилить эмоциональную связь с персонажем."
sow_system_tooltip: '<b>✨ Yume System</b><br><br>

  Это <b>расширенный режим</b> работы программы, который раскроет <b>весь потенциал</b> вашего общения с персонажами.<br><br>

  Вы сможете:<br>

  • Назначать персонажам аватары — статичные или гиф-изображения, анимированные модели Live2D или объёмные VRM-модели;<br>

  • Звонить персонажам — общаться через микрофон в специальном интерфейсе, сделанном специально под этот режим;<br>

  • Подключать дополнительные модули: умную память, эмбиент, переводчик и многие другие.'
personas_button_tooltip: <b>Открывает редактор персон</b><br><br>Позволяет вам создавать, редактировать, выбирать и удалять
  персоны - информацию о пользователях, которые будут взаимодействовать с персонажами.
system_prompt_button_tooltip: "Здесь вы можете <b>отредактировать системный промпт для языковой модели</b> — то, как\
  \ она должна вести себя при общении с вами.<br><br>\n\nВы можете:<br>\n• <b>Редактировать текст промпта</b> — менять\
  \ стиль, добавлять особенности поведения.<br>\n• <b>Менять порядок компонентов</b> — управлять приоритетом информации.<br><br>\n\
  \n<b>Как влияет порядок на ответы персонажа?</b><br>\nМодель помнит лучше то, что указано <b>ближе к концу</b> промпта.<br>\n\
  Если вы хотите, чтобы персонаж чаще ссылался на лор, поставьте лорбук в конец.<br>\nЕсли важнее его личность — переместите\
  \ профиль персонажа вниз.<br><br>\n\n\U0001F4A1 <i>Используйте редактор, чтобы сделать персонажа таким, каким вы хотите.\
  \ \nМеняйте порядок и текст промпта, экспериментируйте!</i>"
lorebook_editor_button_tooltip: '<b>Редактор лорбуков</b><br><br>

  Лорбук — это <b>справочник</b>, который помогает персонажу помнить важные события, термины, места и персонажей.<br><br>

  Когда вы упоминаете что-то из лорбука, программа <b>автоматически подключает нужную информацию</b> к запросу — и персонаж
  отвечает как будто действительно это знает.<br><br>


  <b>Что можно делать:</b><br>

  • <b>Создавать и удалять лорбуки</b>.<br>

  • <b>Добавлять записи</b> — каждый блок информации: место, персонаж, событие, термин.<br>

  • <b>Редактировать ключевые слова</b> — что должно "включать" запись.<br>

  • <b>Выбирать глубину сканирования</b> — сколько последних сообщений анализировать на совпадения.<br><br>


  <b>Пример:</b><br>

  Вы добавляете запись:<br>

  • <i>Текст:</i> «Yume Companion - это программа, которая позволяет общаться с ИИ.»<br>

  • <i>Ключевые слова:</i> Yume Companion, ИИ<br>

  Когда вы скажете: <i>«Что такое Yume Companion?»</i> — Персонаж вспомнит и ответит с информацией об этой записи.'
gpu_layers_tooltip: '<b>Загрузка слоев в GPU</b><br><br>

  Позволяет <b>контролировать, какая часть модели</b> обрабатывается видеокартой (VRAM), а какая — процессором (RAM).<br><br>

  Чем больше слоев в видеокарте, тем быстрее генерация, но тем выше требования к памяти.<br><br>

  💡 <i>Особенно полезно для больших моделей (от 13B). Если у вас мощная видеокарта, выкручивайте на максимум.</i>'
context_size_tooltip: '<b>Контекстное окно</b><br><br>

  Это максимальное количество токенов, которое модель может обработать за раз (её рабочая память). Включает историю чата,
  авторские заметки и записи из lorebook.<br><br>

  Выберите максимальное значение для неограниченного контекста (API) или для автоматического определения максимального
  доступного окна контекста для вашей локальной языковой модели.<br><br>

  Большее контекстное окно позволяет персонажу <b>помнить больше</b>, но значительно увеличивает потребление VRAM.<br><br>

  💡 <i>Уменьшите это значение на слабых ПК. Для долгосрочной памяти лучше держите включённым модуль «Yume Memory», а
  не выкручивайте контекст на максимум.</i>'
mlock_tooltip: '<b>MLock (Блокировка памяти)</b><br><br>

  Эта функция <b>предотвращает выгрузку языковой модели</b> из оперативной памяти (RAM) в файл подкачки на диске.<br><br>

  Когда опция включена, модель остается полностью загруженной в памяти, что гарантирует <b>максимально быстрый отклик</b>
  без микрофризов при генерации каждого нового сообщения.<br><br>

  💡 <i>Рекомендуется включать только при наличии достаточного объема ОЗУ, так как эта память будет постоянно заблокирована
  системой. На ПК с малым объемом памяти лучше оставить отключенной.</i>'
no_mmap_tooltip: '<b>Режим No MMAP (Прямая загрузка в ОЗУ)</b><br><br>

  По умолчанию модели загружаются с использованием отображения в память (<b>mmap</b>), что означает, что части модели
  считываются с диска по требованию прямо во время генерации.<br><br>

  Включение этой опции заставляет систему <b>полностью загружать модель в оперативную память (RAM)</b> заранее.<br>

  Это немного увеличивает время начальной загрузки и потребление RAM, но предотвращает микрозависания и задержки во время
  генерации текста.<br><br>

  💡 <i>Настоятельно рекомендуется, если у вас достаточно системной памяти. Отключите на ПК с малым объемом RAM, чтобы
  избежать аварийного завершения из-за нехватки памяти.</i>'
reasoning_mode_tooltip: '<b>Режим размышлений (Thinking Mode)</b><br><br>

  Создан для мыслящих моделей вроде <i>DeepSeek-R1</i> или <i>QwQ</i>, которые генерируют внутренние рассуждения перед
  ответом.<br><br>

  При включении интерфейс прячет теги <code>&lt;think&gt;</code> в красивый блок и <b>запрещает голосовому движку (TTS)
  читать мысли вслух</b>.<br><br>

  💡 <i>Оставьте выключенным для обычных моделей (Llama-3, Mistral, обычный Qwen).</i>'
flashattention_tooltip: '<b>Flash Attention</b><br><br>

  Новейшая технология, <b>ускоряющая генерацию</b> и <b>снижающая потребление VRAM</b> при обработке длинных чатов.<br><br>

  Оптимизирует вычисления внутри нейросети на больших размерах контекста (4K, 8K и выше).<br><br>

  💡 <i>Настоятельно рекомендуется всегда держать включенным.</i>'
max_tokens_tooltip: '<b>Макс. длина ответа</b><br><br>

  Ограничивает <b>максимальное количество слов</b>, которое может написать персонаж за один раз.<br><br>

  💡 <i>Слишком длинные ответы забивают контекст. Оптимально: 300–500 токенов.</i>'
reasoning_effort_tooltip: '<b>Объем рассуждений</b><br><br>

  Управляет объемом внутренних рассуждений, которые могут выполнять языковые модели перед ответом.<br>

  Применяется к моделям OpenAI o-series/GPT-5, Claude extended thinking, Gemini, Grok, DeepSeek, Qwen и GLM.'
custom_args_tooltip: '<b>Пользовательские аргументы</b><br><br>

  Позволяет передавать дополнительные аргументы командной строки напрямую локальному LLM-серверу (llama.cpp).<br><br>

  Это предназначено для опытных пользователей, которые хотят точно настроить специфические параметры движка (например,
  масштабирование RoPE или параметры кэширования), не представленные в графическом интерфейсе.<br><br>

  💡 <i>Используйте с осторожностью. Неверные флаги могут привести к сбою сервера или переопределить настройки интерфейса.
  Пример: <b>--rope-freq-base 10000</b></i>'
chat_template_tooltip: '<b>Шаблон чата (Chat Template)</b><br><br>

  Определяет, в каком формате ваш текст отправляется нейросети. Разные ИИ обучены на разных форматах.<br><br>

  Если шаблон не совпадает с моделью, бот начнет галлюцинировать или выводить спецсимволы (например, <code>&lt;|im_end|&gt;</code>).<br><br>

  💡 <i>''Auto'' берет шаблон прямо из GGUF файла. Если модель ведет себя странно, выберите вручную ''ChatML'' или ''Llama-3''.</i>'
stop_strings_tooltip: '<b>Стоп-строки (Stop Strings)</b><br><br>

  Список слов или тегов, при появлении которых ИИ <b>немедленно прекращает генерацию</b>.<br><br>

  Это важнейший инструмент, чтобы запретить ИИ говорить или действовать за вас (например, генерировать <code>\nUser:</code>
  и отвечать на свои же вопросы).<br><br>

  💡 <i>Перечисляйте через запятую. Пример: <code>\nUser:, &lt;/s&gt;, &lt;|eot_id|&gt;</code></i>'
temperature_tooltip: '<b>Температура (Креативность)</b><br><br>

  Контролирует базовый уровень хаоса в ответах.<br><br>

  • <b>Низкая (0.1–0.5):</b> Логично и предсказуемо. Скучно для ролевых игр.<br>

  • <b>Высокая (0.8–1.5):</b> Очень креативно, эмоционально и непредсказуемо.<br><br>

  💡 <i>Рекомендуется: 0.8–1.0. При высоких значениях обязательно используйте <b>Min-P</b> для защиты от бреда.</i>'
freq_penalty_tooltip: '<b>Штраф за частоту (Frequency Penalty)</b><br><br>

  Штрафует слова в зависимости от того, <b>сколько раз они уже встречались</b> в тексте.<br><br>

  Заставляет ИИ использовать богатый словарный запас и искать синонимы, а не повторять одни и те же прилагательные.<br><br>

  💡 <i>Слишком высокие значения ломают грамматику. Оптимально: 0.0 - 0.5.</i>'
pres_penalty_tooltip: '<b>Штраф за присутствие (Presence Penalty)</b><br><br>

  Накладывает штраф на слово, если оно встретилось <b>хотя бы один раз</b>.<br><br>

  В отличие от штрафа за частоту, это заставляет ИИ <b>менять тему разговора</b> и вводить новые концепции, не давая
  диалогу застрять в одной точке.<br><br>

  💡 <i>При высоких значениях ИИ будет хаотично прыгать по темам. Оптимально: 0.0 - 0.4.</i>'
min_p_tooltip: '<b>Min-P (Умное отсечение)</b><br><br>

  Новый золотой стандарт RolePlay. Динамически отсекает мусорные слова на основе вероятности самого лучшего слова.<br><br>

  Если ИИ уверен в ответе, Min-P безжалостно режет бред. Если ИИ нужно проявить фантазию, барьер снижается, впуская красивые
  синонимы.<br><br>

  💡 <i>Замена Top-P. Установите Top-P на 1.0, а Min-P на <b>0.05 - 0.10</b> для идеальной логики при высокой Температуре.</i>'
top_p_tooltip: '<b>Top-P</b><br><br>

  Старый метод сэмплинга, ограничивающий выбор слов суммарным процентом вероятности.<br><br>

  💡 <i>Если вы используете <b>Min-P</b>, обязательно отключите Top-P, установив его на <b>1.0</b>.</i>'
dyn_temp_min_tooltip: '<b>Динамическая Температура</b><br><br>

  Вместо фиксированного значения, температура плавает между Мин. и Макс. границами в зависимости от уверенности ИИ.<br><br>

  Описывая факты, температура падает для логики. Описывая эмоции, температура взлетает для креатива.'
dyn_temp_max_tooltip: '<b>Динамическая Температура</b><br><br>

  Вместо фиксированного значения, температура плавает между Мин. и Макс. границами в зависимости от уверенности ИИ.<br><br>

  Описывая факты, температура падает для логики. Описывая эмоции, температура взлетает для креатива.'
xtc_prob_tooltip: '<b>XTC (Удаление банальностей)</b><br><br>

  Революция для RP. Принудительно <b>удаляет самые очевидные и клишированные слова</b> из вариантов выбора ИИ.<br><br>

  Устали от фраз <i>"мурашки пробежали по спине"</i> или <i>"хищная ухмылка"</i>? XTC заставит модель искать уникальные,
  литературные альтернативы.<br><br>

  💡 <i><b>Вероятность:</b> Шанс срабатывания алгоритма (Оптимально 0.3 - 0.5).</i>'
xtc_thresh_tooltip: '<b>Порог XTC (Threshold)</b><br><br>

  Определяет, насколько "популярным" (вероятным) должно быть слово, чтобы алгоритм XTC имел право его удалить.<br><br>

  💡 <i>Оптимально: 0.1 (Удаляются только слова с вероятностью выше 10%).</i>'
dry_mult_tooltip: '<b>DRY (Множитель)</b><br><br>

  В отличие от старых алгоритмов, DRY (Don''t Repeat Yourself) распознает и штрафует <b>повторения целых предложений
  и структур</b>.<br><br>

  Если Вайфу постоянно начинает сообщения фразой <i>"Я вздыхаю и смотрю на тебя"</i>, DRY сломает этот паттерн и заставит
  ее действовать иначе.<br><br>

  💡 <i><b>Множитель:</b> Сила штрафа (Оптимально 0.8).</i>'
dry_base_tooltip: '<b>DRY База</b><br><br>

  Базовый коэффициент масштабирования алгоритма. Определяет, насколько агрессивно растет штраф от длины повторяющейся
  фразы.<br><br>

  💡 <i>Оптимально: 1.75</i>'
dry_length_tooltip: '<b>Допуск длины DRY</b><br><br>

  Количество токенов (слов/слогов), которым разрешено повторяться до того, как сработает штраф DRY.<br><br>

  💡 <i>Оптимально: 2 (Чтобы не штрафовать короткие связки типа "Я есть" или "И тут").</i>'
kv_cache_tooltip: Квантизируйте Context Cache, чтобы сэкономить значительный объем видеопамяти при работе с длинными
  контекстами.
batch_size_tooltip: 'Количество токенов, обрабатываемых одновременно при оценке промпта.<br><br>

  Значение 512 является безопасным. Чем выше значение, тем быстрее загрузка и тем больше требуется VRAM.'
cpu_threads_tooltip: '0 = Автоматически.<br><br>

  Укажите количество физических ядер процессора для обеспечения оптимальной скорости инференса на процессоре.'
cpu_moe_layers_tooltip: 0 = Отключено. Количество слоев «Mixture of Experts» (MoE), размещаемых в оперативной памяти
  (CPU RAM). Крайне важно для работы с моделями архитектуры MoE.
auto_summary_tooltip: Этот параметр позволит вам назначать количество сообщений, после которых будет происходить генерация
  краткой сводки вашего чата.
