people_title: "Personen und Reisen"
people_intro: "Geburtstage, Notizen und Geschenkideen („Anna hat am 12. Mai Geburtstag und mag keine Pilze“) sowie geplante Reisen. Yume erinnert dich an Geburtstage und nutzt alles in ihren Antworten."
