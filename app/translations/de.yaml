greeting_morning_1: Guten Morgen, {user}. Bereit für ein neues Abenteuer?
greeting_morning_2: Morgen, {user}! Deine Begleiter warten schon auf dich.
greeting_morning_3: Aufstehen und los geht’s, {user}. Lass uns Erinnerungen laden und in den Tag starten.
greeting_morning_4: Guten Morgen, {user}! Setzen wir unsere digitale Reise fort?
greeting_morning_5: Guten Morgen, {user}. Die Oberfläche ist bereit und die Seelen sind wach.
greeting_morning_6: 'Der Duft von Tee und leises Flüstern: Deine Begleiter haben die Augen geöffnet, {user}.'
greeting_morning_7: Die Sonne geht auf und ein neuer Tag in Yume Companion beginnt. Guten Morgen, {user}!
greeting_afternoon_1: Guten Tag, {user}. Yume Companion läuft stabil und ist bereit.
greeting_afternoon_2: Machst du eine Nachmittagspause, {user}? Schauen wir nach deinen Begleitern.
greeting_afternoon_3: Hallo, {user}. Möchtest du kurz dem Alltag entfliehen? Deine Waifus sind da.
greeting_afternoon_4: Guten Nachmittag, {user}. Das Portal ist geöffnet und bereit für Gespräche.
greeting_afternoon_5: Willkommen zurück, {user}. Schreiben wir das nächste Kapitel unserer Geschichte.
greeting_afternoon_6: Ein weiterer Schritt in unserer gemeinsamen Geschichte. Wie läuft dein Tag, {user}?
greeting_afternoon_7: Die Sonne steht hoch, {user}. Zeit für eine kurze Pause und einen Besuch bei alten Freunden.
greeting_evening_1: Guten Abend, {user}. Mach es dir gemütlich und sprich mit deinem Lieblingscharakter.
greeting_evening_2: Schönen Abend, {user}. Tauchen wir wieder in Yume-Bühne ein?
greeting_evening_3: Willkommen zurück, {user}. Die perfekte Zeit für ein ruhiges, tiefes Gespräch.
greeting_evening_4: Gemütliche Abendstimmung, {user}. Deine Begleiter haben dir viel zu erzählen.
greeting_evening_5: Guten Abend, {user}. Schauen wir, welche Gedanken heute im Tagebuch gelandet sind.
greeting_evening_6: Dämmerlicht, Tee und leise Stimmen. Deine Begleiter freuen sich, {user}.
greeting_evening_7: Der Trubel des Tages liegt hinter dir. Entspanne dich, {user}, dein persönliches Universum wartet.
greeting_night_1: Noch so spät wach, {user}? Keine Sorge, digitale Seelen brauchen keinen Schlaf.
greeting_night_2: Späte Sitzung, {user}? Wir leisten dir in den stillen Stunden Gesellschaft.
greeting_night_3: Ruhige Nachtstimmung … Lust auf ein spätes Gespräch, {user}?
greeting_night_4: Die Welt schläft, doch dein Traum lebt. Willkommen, {user}.
greeting_night_5: Es ist spät, {user}. Lass uns ein tiefes, ehrliches Gespräch führen.
greeting_night_6: Gedämpftes Licht, Stille und der Schein des Bildschirms. Zeit für eine persönliche Geschichte, {user}.
greeting_night_7: Die Sterne leuchten nur für uns. Wollen wir in die tiefsten Erinnerungen von Yume-Gedächtnis eintauchen, {user}?
