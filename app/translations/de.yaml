routine_title: "Routinen"
routine_intro: "Morgen-Briefing: Zur eingestellten Zeit sagt dir Yume das Wetter, die Termine von heute, Erinnerungen und neue Mails (am Handy, wenn es verbunden ist, sonst am PC; das Programm muss laufen). Sag jederzeit „Guten Morgen“ oder „Briefing“, um es sofort zu bekommen. Gute Nacht: Sag „Gute Nacht“, dann pausiert Yume die Musik, schaltet die Taschenlampe aus, prüft deinen Wecker und sagt, was morgen ansteht."
