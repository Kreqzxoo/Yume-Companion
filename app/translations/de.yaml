kb_title: "Wissensdatenbank (deine Dokumente)"
kb_intro: "Wähle Ordner mit deinen PDFs, Word-Dateien und Notizen. Yume liest sie einmal (lokal, nichts verlässt den PC) und kann dann Fragen wie „Was steht im Mietvertrag zur Kündigung?“ mit Dateiname und Seite beantworten. Neue und geänderte Dateien werden automatisch nachgelesen."
