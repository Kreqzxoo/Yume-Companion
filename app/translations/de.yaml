soul_memory_tooltip: '<b>🧠 Yume-Gedächtnis</b><br><br>Entwickle deinen Charakter von einer einfachen KI zu einer digitalen Figur
  mit einem <b>kontinuierlichen Langzeitgedächtnis</b>. Yume-Gedächtnis ist der kognitive Kern des Yume-Ökosystems.<br><br>Statt
  sich auf unzuverlässige Volltextsuchen zu verlassen, verwendet Yume-Gedächtnis eine fortgeschrittene <b>Multi-Agenten-Architektur</b>:<br>•
  <b>Dual-Core-Indexierung:</b> Trennt die Psychologie des Charakters (<i>MEMORY.md</i>) vom Benutzerprofil und den Beziehungsmetadaten
  (<i>USER.md</i>). Das verhindert Rollenkonflikte und optimiert Prompt-Caching.<br>• <b>Archivar und Tagebuch:</b> Hintergrundagenten
  erstellen selbstständig dichte, episodische Wissenseinträge und schreiben persönliche <i>emotionale Tagebucheinträge in
  der Ich-Form</i> über eure Interaktionen.<br>• <b>Selbstheilung und Verfall:</b> Erkennt und löst logische Widersprüche
  im Gedächtnis mit der Zeit automatisch und berücksichtigt dabei natürliche emotionale Übergänge.<br><br>Das Ergebnis: weniger
  unnötiger Kontext und eine konsistente Persönlichkeit. Ob im Bühnen-Abenteuer oder mit deinem Yume-Desktop-Begleiter – <b>der
  Charakter kann sich an frühere Inhalte erinnern</b>.'
sm_mode_full: "Volle Synchronisation"
sm_mode_soul_link: "Seelenverbindung"
sm_mode_mind_spark: "Gedankenfunke"
sm_mode_reflection_flow: "Reflexionsfluss"
sm_mode_full_tooltip: "<b>🌌 Volle Synchronisation</b><br><br>\nVollständige kognitive Verbindung. Jeder Aspekt des Charakters ist aktiv:<br><br>\n• <b>Psychologischer Index:</b> Stimmungsverfolgung in Echtzeit.<br>\n• <b>Lore-Themen:</b> Tiefes Weltwissen und Fakten.<br>\n• <b>Tagebuch:</b> Emotionale Reflexionen in der Ich-Form.<br><br>\n<i>Das ultimative Erlebnis. Erfordert einen leistungsstarken PC oder eine API.</i>"
sm_mode_soul_link_tooltip: "<b>🔗 Seelenverbindung</b><br><br>\nKonzentriert sich auf Persönlichkeit und Gefühle.<br><br>\n• Aktualisiert den <b>MEMORY.md</b>-Index, damit Stimmung und Ziele des Charakters konsistent bleiben.<br>\n• Der <b>Tagebuch-Agent</b> hält die privaten Gefühle gegenüber dir fest.<br><br>\n<b>Entfällt:</b> Lore-Themen werden weder erstellt noch aktualisiert.<br><br>\n<i>Ideal für: eine tiefe Bindung ohne hohe CPU-/GPU-Last.</i>"
sm_mode_mind_spark_tooltip: "<b>⚡ Gedankenfunke</b><br><br>\nTaktisches Gedächtnis für maximale Leistung.<br><br>\n• Aktualisiert <b>NUR</b> den <b>MEMORY.md</b>-Index.<br><br>\nSorgt dafür, dass der Charakter weiß, wer er ist, wie er sich fühlt und was er gerade will.<br><br>\n<b>Entfällt:</b> Es werden keine Tagebücher oder Lore-Dateien erzeugt.<br><br>\n<i>Ideal für: langsame PCs oder schnelles Rollenspiel, bei dem nur die Logik zählt.</i>"
sm_mode_reflection_flow_tooltip: "<b>📓 Reflexionsfluss</b><br><br>\nEmotionales Protokoll ohne Einfluss auf die Chat-Logik.<br><br>\n• Nur der <b>Tagebuch-Agent</b> ist aktiv.<br><br>\nDer Charakter aktualisiert seinen „inneren Zustand“ nicht im Index, schreibt aber weiterhin emotionale Einträge in sein Tagebuch.<br><br>\n<b>Entfällt:</b> Kein psychologischer Index und keine Lore-Updates.<br><br>\n<i>Ideal für: maximale Geschwindigkeit bei erhaltener Gefühlshistorie des Charakters.</i>"
ambient_sound_tooltip: '<b>🎵 Modul für Umgebungsgeräusche</b><br><br>Diese Funktion spielt beim Öffnen eines Charakter-Chats
  passende <b>Atmosphärenklänge</b> ab.<br><br>Nach dem Aktivieren kannst du eine passende <b>Umgebungskulisse</b> auswählen
  – Hintergrundmusik oder Geräusche, die die richtige Stimmung erzeugen: etwa rauschender Wind, Regentropfen oder das gemütliche
  Knistern eines Lagerfeuers.<br><br><b>Beispiel:</b><br>Wenn du mit einem Charakter in einer <i>Taverne</i> chattest, kannst
  du eine Kulisse mit <i>Stimmengewirr und einer fröhlichen Melodie</i> wählen, um tiefer in die Atmosphäre des Ortes einzutauchen
  und die emotionale Verbindung zum Charakter zu verstärken.'
sow_system_tooltip: <b>✨ Yume-System</b><br><br>Dies ist der <b>erweiterte Modus</b> des Programms, der das <b>volle
  Potenzial</b> der Interaktion mit Charakteren freischaltet.<br><br>Du kannst:<br>• Charakteren statische Bilder, GIFs, animierte
  Live2D-Modelle oder räumliche VRM-Modelle zuweisen;<br>• Charaktere aufrufen und über ein Mikrofon in einer speziell für
  diesen Modus gestalteten Oberfläche mit ihnen sprechen;<br>• zusätzliche Module wie Yume-Gedächtnis, Umgebungsgeräusche, Übersetzer
  und weitere Funktionen verbinden.
personas_button_tooltip: <b>Öffnet den Persona-Editor</b><br><br>Hier kannst du Personas erstellen, bearbeiten, auswählen
  und löschen – Informationen über den Benutzer, der mit dem Charakter chattet.
system_prompt_button_tooltip: Hier kannst du den <b>System-Prompt anpassen</b>, der festlegt, wie sich der Charakter während
  eurer Gespräche verhalten soll.<br><br>Du kannst:<br>• <b>den Prompt-Text bearbeiten</b> – Tonfall, Sprechmuster oder Eigenheiten
  anpassen.<br>• <b>Bausteine neu sortieren</b> – die Priorität der Informationen steuern.<br><br><b>Warum ist die Reihenfolge
  wichtig?</b><br>Das Modell berücksichtigt häufig Inhalte besser, die <b>näher am Ende</b> des Prompts stehen.<br>Wenn der
  Charakter öfter auf Weltwissen zurückgreifen soll, verschiebe das Weltwissen ans Ende.<br>Wenn die Persönlichkeit besonders
  wichtig ist, platziere die Charakterinformationen zuletzt.<br><br>💡 <i>Nutze diesen Editor, damit dein Charakter authentischer,
  konsistenter und lebendiger wirkt. Passe Text und Reihenfolge an, bis die Antworten so klingen, wie du es möchtest.</i>
lorebook_editor_button_tooltip: '<b>Weltwissen-Editor</b><br><br>Ein Weltwissensbuch ist ein <b>Nachschlagewerk</b>, das einem
  Charakter hilft, wichtige Ereignisse, Begriffe, Orte und Figuren im Gedächtnis zu behalten.<br><br>Wenn du etwas aus dem
  Weltwissen erwähnst, fügt das Programm die <b>passenden Informationen automatisch</b> zur Anfrage hinzu, sodass der Charakter
  antworten kann, als würde er es kennen.<br><br><b>Was du tun kannst:</b><br>• <b>Weltwissensbücher erstellen und löschen</b>.<br>•
  <b>Einträge hinzufügen</b> – etwa Orte, Figuren, Ereignisse oder Begriffe.<br>• <b>Schlüsselwörter bearbeiten</b> – was
  einen Eintrag auslösen soll.<br>• <b>Suchtiefe wählen</b> – wie viele der letzten Nachrichten auf passende Begriffe geprüft
  werden.<br><br><b>Beispiel:</b><br>Du legst einen Eintrag an:<br>• <i>Text:</i> „Yume Companion ist ein Programm, mit dem
  man mit KI kommunizieren kann.“<br>• <i>Schlüsselwörter:</i> Yume Companion, KI<br>Wenn du fragst: <i>„Was ist Yume Companion?“</i>,
  kann sich der Charakter an den Eintrag erinnern und entsprechend antworten.'
gpu_layers_tooltip: "<b>GPU-Layer-Auslagerung</b><br><br>\nHiermit steuerst du, <b>wie viel vom LLM</b> direkt auf deiner Grafikkarte läuft, und balancierst <b>Geschwindigkeit</b> und <b>Grafikspeicher-Verbrauch</b>.<br><br>\nJe mehr Schichten im VRAM liegen, desto schneller antwortet das Modell – aber desto höher ist der Speicherbedarf.<br>\nDu kannst die Zahl der ausgelagerten Schichten manuell anpassen und so auch große Modelle auf Mittelklasse-Grafikkarten betreiben.<br><br>\n💡 <i>Besonders nützlich bei großen Modellen. Je stärker deine GPU, desto mehr Schichten kannst du zuweisen.</i>"
context_size_tooltip: "<b>Kontextfenster</b><br><br>\nDie maximale Anzahl an Tokens, die das Modell gleichzeitig verarbeiten kann (sein Arbeitsgedächtnis). Sie umfasst Chatverlauf, Autorennotizen und Lorebook-Einträge.<br><br>\nWähle den höchsten Wert für unbegrenzten Kontext (API) oder um das größte verfügbare Kontextfenster deines lokalen Modells automatisch zu erkennen.<br><br>\nEin größeres Kontextfenster lässt den Charakter <b>mehr behalten</b>, erhöht aber den VRAM-Bedarf deutlich.<br><br>\n💡 <i>Senke den Wert auf schwächeren PCs. Für ein Langzeitgedächtnis lieber das Modul „Yume-Gedächtnis“ aktiv lassen, statt den Kontext voll auszureizen.</i>"
mlock_tooltip: <b>MLock (Speicher sperren)</b><br><br>Diese Funktion <b>verhindert, dass das Sprachmodell aus dem RAM in die
  Auslagerungsdatei</b> auf deinem Laufwerk verschoben wird.<br><br>Wenn aktiviert, bleibt das Modell vollständig im Arbeitsspeicher.
  Das sorgt für <b>möglichst kurze Antwortzeiten</b> und reduziert kleine Verzögerungen bei der Textgenerierung.<br><br>💡
  <i>Nur empfehlenswert, wenn ausreichend RAM vorhanden ist, da dieser dauerhaft reserviert wird. Auf Systemen mit wenig RAM
  sollte die Option deaktiviert bleiben.</i>
no_mmap_tooltip: <b>No-MMAP-Modus (direktes Laden in den RAM)</b><br><br>Standardmäßig werden Modelle per Memory Mapping (<b>mmap</b>)
  geladen. Dabei werden Teile des Modells während der Generierung bei Bedarf vom Laufwerk gelesen.<br><br>Wenn du diese Option
  aktivierst, wird das <b>gesamte Modell vorab in den RAM geladen</b>.<br>Das verlängert den ersten Ladevorgang und erhöht
  den RAM-Bedarf etwas, kann aber kleine Verzögerungen bei der Textgenerierung vermeiden.<br><br>💡 <i>Empfehlenswert, wenn
  genügend RAM vorhanden ist. Auf Systemen mit wenig RAM deaktiviert lassen, damit es nicht zu Speicherfehlern kommt.</i>
reasoning_mode_tooltip: <b>Denk-/Reasoning-Modus (&lt;think&gt;)</b><br><br>Wenn aktiviert, gibt das KI-Modell vor der endgültigen
  Antwort zusätzliche Denkschritte innerhalb von <b>&lt;think&gt;</b>-Tags aus.<br><br>Das kann Logik, Mathematik und Problemlösung
  verbessern, weil das Modell schrittweise vorgeht.<br>Allerdings verbraucht es mehr Tokens und erhöht die Antwortzeit, da
  zuerst die internen Denkschritte generiert werden.<br><br>💡 <i>Für komplexe Aufgaben, Rätsel oder anspruchsvolle Rollenspiel-Logik
  aktivieren. Für einfache, schnelle Chats deaktivieren.</i>
flashattention_tooltip: <b>Flash Attention</b><br><br>Diese Technik <b>beschleunigt die KI</b> und <b>reduziert den VRAM-Verbrauch</b>
  bei langen Gesprächen.<br><br>Sie optimiert Berechnungen und macht die Textgenerierung auch bei großen Kontextfenstern effizienter.<br><br>💡
  <i>Für maximale Leistung aktiviert lassen, sofern Modell und Backend diese Funktion unterstützen.</i>
max_tokens_tooltip: "<b>Maximale Antwortlänge</b><br><br>\nLegt fest, <b>wie lang die Antwort des Charakters</b> höchstens sein darf.<br><br>\n💡 <i>Sehr lange Antworten verbrauchen Kontext. Empfohlen: 300–500 Tokens.</i>"
reasoning_effort_tooltip: "<b>Denkaufwand</b><br><br>\nLegt fest, wie viel internes Nachdenken Cloud-Reasoning-Modelle vor der Antwort betreiben dürfen.<br>\nGilt für OpenAI o-Serie/GPT-5, Claude Extended Thinking, Gemini, Grok, DeepSeek, Qwen und GLM-Reasoning-Modelle."
custom_args_tooltip: "<b>Eigene Backend-Argumente</b><br><br>\nErlaubt es, zusätzliche Kommandozeilen-Argumente direkt an den lokalen LLM-Server (llama.cpp) zu übergeben.<br><br>\nFür fortgeschrittene Nutzer gedacht, die Engine-Parameter (z. B. RoPE-Skalierung oder Cache-Einstellungen) feinjustieren wollen, die nicht in der Oberfläche stehen.<br><br>\n💡 <i>Mit Vorsicht verwenden. Falsche Flags können den Server abstürzen lassen oder deine Einstellungen überschreiben. Beispiel: <b>--rope-freq-base 10000</b></i>"
chat_template_tooltip: <b>Chat-Vorlage</b><br><br>Legt fest, wie das System den Gesprächsverlauf vor dem Senden an die KI
  formatiert. Verschiedene Modelle wurden mit bestimmten Formaten trainiert.<br><br>Bei einer falschen Vorlage kann die KI
  halluzinieren oder merkwürdige Symbole ausgeben, etwa <code>&lt;|im_end|&gt;</code>.<br><br>💡 <i>„Auto“ liest die Vorlage
  direkt aus der GGUF-Datei. Wenn sich das Modell ungewöhnlich verhält, erzwinge eine passende Vorlage wie „ChatML“ oder „Llama-3“.</i>
stop_strings_tooltip: '<b>Stoppzeichenfolgen</b><br><br>Eine Liste von Wörtern oder Symbolen, bei denen die KI die Textgenerierung
  <b>sofort beendet</b>.<br><br>Das hilft zu verhindern, dass die KI für dich spricht oder handelt, beispielsweise indem sie
  <code>\nUser:</code> generiert und deine Antwort fortsetzt.<br><br>💡 <i>Mit Kommas trennen. Beispiel: <code>\nUser:, &lt;/s&gt;,
  &lt;|eot_id|&gt;</code></i>'
temperature_tooltip: "<b>Temperatur (Kreativität)</b><br><br>\nSteuert die grundlegende Zufälligkeit der KI-Antworten.<br><br>\n• <b>Niedrig (0,1–0,5):</b> Logisch und vorhersehbar. Langweilig fürs Rollenspiel.<br>\n• <b>Hoch (0,8–1,5):</b> Sehr kreativ, ausdrucksstark und unberechenbar.<br><br>\n💡 <i>Empfohlen: 0,8–1,0. Bei höheren Werten unbedingt <b>Min-P</b> nutzen, um unsinnige Wörter abzuschneiden.</i>"
freq_penalty_tooltip: "<b>Häufigkeitsstrafe</b><br><br>\nBestraft Wörter danach, <b>wie oft sie schon im Text vorkamen</b>.<br><br>\nSo muss die KI einen reicheren Wortschatz nutzen und Synonyme suchen, statt immer dieselben Adjektive zu wiederholen.<br><br>\n💡 <i>Zu hohe Werte zerstören die Grammatik. Empfohlen: 0,0 – 0,5.</i>"
pres_penalty_tooltip: "<b>Präsenzstrafe</b><br><br>\nBestraft ein Wort pauschal, sobald es <b>mindestens einmal</b> vorkam.<br><br>\nAnders als die Häufigkeitsstrafe ermutigt sie die KI, <b>das Thema zu wechseln</b> und neue Konzepte einzubringen, damit das Gespräch nicht in einer Schleife hängen bleibt.<br><br>\n💡 <i>Hohe Werte lassen die KI sprunghaft zwischen Themen wechseln. Empfohlen: 0,0 – 0,4.</i>"
min_p_tooltip: "<b>Min-P (Intelligenter Cut-off)</b><br><br>\nDer neue Goldstandard fürs Rollenspiel. Er schneidet Unsinnswörter dynamisch anhand der Wahrscheinlichkeit des besten Wortes ab.<br><br>\nIst die KI sich sicher, entfernt er Unsinn konsequent. Soll sie kreativ sein, senkt er die Hürde und lässt gute Synonyme zu.<br><br>\n💡 <i>Ersetzt Top-P. Top-P auf 1,0 stellen und Min-P auf <b>0,05 – 0,10</b> setzen: perfekte Logik bei hoher Temperatur.</i>"
top_p_tooltip: "<b>Top-P</b><br><br>\nEin älteres Sampling-Verfahren, das die Wortauswahl auf einen kumulativen Prozentsatz begrenzt.<br><br>\n💡 <i>Wenn du <b>Min-P</b> nutzt, solltest du Top-P deaktivieren, indem du es auf <b>1,0</b> stellst.</i>"
dyn_temp_min_tooltip: <b>Dynamische Temperatur (Minimum/Maximum)</b><br><br>Statt eines festen Werts verändert sich die Temperatur
  abhängig von der Sicherheit des Modells dynamisch zwischen Minimal- und Maximalwert.<br><br>Bei Fakten sinkt die Temperatur,
  damit die Antwort logisch bleibt. Beim Beschreiben von Emotionen steigt sie, um kreative Formulierungen zu ermöglichen.
dyn_temp_max_tooltip: <b>Dynamische Temperatur (Minimum/Maximum)</b><br><br>Statt eines festen Werts verändert sich die Temperatur
  abhängig von der Sicherheit des Modells dynamisch zwischen Minimal- und Maximalwert.<br><br>Bei Fakten sinkt die Temperatur,
  damit die Antwort logisch bleibt. Beim Beschreiben von Emotionen steigt sie, um kreative Formulierungen zu ermöglichen.
xtc_prob_tooltip: "<b>XTC (Top-Auswahl ausschließen)</b><br><br>\nEine geniale Funktion fürs Rollenspiel. Sie <b>entfernt gezielt die offensichtlichsten Klischee-Wörter</b> aus der Auswahl der KI.<br><br>\nGenervt von <i>„Schauer liefen mir über den Rücken“</i> oder <i>„raubtierhaftes Grinsen“</i>? XTC zwingt das Modell zu eigenständigen, literarischen Alternativen und macht die Sprache viel lebendiger.<br><br>\n💡 <i><b>Wahrscheinlichkeit:</b> Chance, dass XTC auslöst (probiere 0,3 – 0,5).</i>"
xtc_thresh_tooltip: "<b>XTC-Schwelle</b><br><br>\nLegt fest, wie „beliebt“ ein Wort sein muss, damit XTC es entfernen darf.<br><br>\n💡 <i>Empfohlen: 0,1 (nur Wörter mit mehr als 10 % Wahrscheinlichkeit können entfernt werden).</i>"
dry_mult_tooltip: "<b>DRY (Wiederhole dich nicht)</b><br><br>\nAnders als ältere Strafen, die einzelne Wörter treffen, erkennt DRY <b>ganze sich wiederholende Abfolgen und Satzstrukturen</b> und bestraft sie.<br><br>\nBeginnt deine Waifu jede Nachricht mit <i>„Ich seufze und sehe dich an“</i>, erkennt DRY das Muster und zwingt sie, anders zu handeln.<br><br>\n💡 <i><b>Multiplikator:</b> Stärke der Strafe (probiere 0,8).</i>"
dry_base_tooltip: "<b>DRY-Basis</b><br><br>\nDer Skalierungsfaktor des DRY-Algorithmus. Bestimmt, wie stark die Strafe mit der Länge der Abfolge wächst.<br><br>\n💡 <i>Empfohlen: 1,75</i>"
dry_length_tooltip: "<b>DRY erlaubte Länge</b><br><br>\nDie Anzahl an Tokens, die sich wiederholen dürfen, bevor die DRY-Strafe greift.<br><br>\n💡 <i>Empfohlen: 2 (verhindert, dass gängige Zwei-Wort-Phrasen wie „ich bin“ bestraft werden).</i>"
kv_cache_tooltip: "Quantisiert den Kontext-Cache und spart bei langen Kontexten enorm viel VRAM."
batch_size_tooltip: "Tokens, die bei der Prompt-Auswertung gleichzeitig verarbeitet werden.<br><br> 512 ist sicher. Höher = schnelleres Laden, mehr VRAM."
cpu_threads_tooltip: "0 = automatisch.<br><br> Auf die Anzahl der physischen CPU-Kerne setzen, für optimale Geschwindigkeit auf der CPU."
cpu_moe_layers_tooltip: "0 = deaktiviert. Wie viele Mixture-of-Experts-(MoE)-Schichten im CPU-RAM bleiben. Wichtig für riesige MoE-Modelle."
auto_summary_tooltip: "Hier legst du fest, nach wie vielen Nachrichten eine Zusammenfassung deines Chats erstellt wird."
attach_file_tooltip: "Bild oder Dokument an die Nachricht anhängen"
