auto_title: "Hintergrund-Aufträge, Abläufe und Fähigkeiten"
auto_intro: "Aufträge: Aufgaben, an denen Yume selbstständig arbeitet. Abläufe: Reihenfolgen, die du ihr per Sprache beigebracht hast („Merk dir das als Ablauf Feierabend …“). Fähigkeiten: kleine Programme, die Yume sich selbst geschrieben hat, nachdem du den Code freigegeben hast."
