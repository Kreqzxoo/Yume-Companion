pcwake_title: "Hey Yume am PC"
pcwake_intro: "Yume hört im Hintergrund zu (auch bei geschlossenem Chat) und wartet auf dein Weckwort. Hört sie es, erscheint unten rechts eine kleine Karte mit ihrem 3D-Modell, du sprichst und sie antwortet. Alles wird auf diesem PC geprüft, nichts wird gespeichert. Nutzt Mikrofon und Spracherkennung (Whisper)."
