about_program: Über Yume Companion
about_program_title: Über Yume Companion
about_program_description: <b>Yume Companion</b> ist eine kostenlose Open-Source-Desktop-Anwendung, in der KI-Charaktere sich
  erinnern, entwickeln und sowohl im Programm als auch auf deinem Desktop präsent sein können. Erstelle oder importiere einen
  Charakter einmal und interagiere mit ihm über drei miteinander verbundene Bereiche:<br><br>• 💬 <b>Interaktiver Text- und
  Sprachchat:</b> Live-Dialoge zu zweit mit animierten Live2D-/VRM-Avataren, laufender Sprachausgabe, adaptiver Statusanzeige,
  Dateianhängen und Werkzeugnutzung.<br><br>• 🎲 <b>Bühnen-Rollenspiel-Engine:</b> Textbasierte Pen-and-Paper-Rollenspiele
  mit einem KI-Spielleiter, Weltzustand, Inventarverwaltung und dynamischen NPCs.<br><br>• 🖥️ <b>Yume-Desktop-Begleiter:</b> Eine
  eigenständige Figur auf deinem Desktop mit neurohormonellem Stimmungsmodell, Sichtfunktionen, Pufferlesen und Werkzeugaufrufen.<br><br>Alle
  Bereiche sind über das Modul <b>Yume-Gedächtnis</b> verbunden – ein kognitives Gedächtnissystem mit emotionaler Entwicklung,
  persönlichem Tagebuch und automatischer Auflösung von Widersprüchen. Läuft mit GGUF zu 100 % lokal und privat auf deinem
  PC (CUDA, Vulkan, HIP, SYCL), ohne Filter oder Abonnements; Cloud-APIs, Discord und ein lokaler Webclient werden ebenfalls
  unterstützt.
