organizer_cal_intro: "Yume liest deine Kalender und kann eigene Termine eintragen („Yume, trag morgen um 15 Uhr Zahnarzt ein“). Den Kalender des Handys liest sie automatisch über das Handy (Kalender-Berechtigung in der App). Für Google-, Outlook- oder Apple-Kalender am PC fügst du hier den geheimen iCal-Link ein, einen pro Zeile (Google: Kalender-Einstellungen > dein Kalender > „Geheime Adresse im iCal-Format“). Die Links sind nur lesbar und werden verschlüsselt gespeichert."
organizer_save_test: "Speichern und testen"
organizer_mail_title: "Mail (nur lesen)"
organizer_mail_intro: "Yume kann dir neue Mails nennen und zusammenfassen. Sie LIEST nur (nichts wird gesendet, gelöscht oder als gelesen markiert). Nimm ein IMAP-App-Passwort, nicht dein normales Passwort (Gmail: Google-Konto > Sicherheit > App-Passwörter; IMAP muss aktiv sein). Das Passwort wird verschlüsselt gespeichert. Hinweis: Der Text gelesener Mails geht an das gewählte Sprachmodell – bei einem Cloud-Modell also an diesen Anbieter."
