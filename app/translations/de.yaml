tts_notice_title: 💡 Hinweis beim ersten Start der TTS-Engines
tts_notice_first_run_text: 'Bitte beachte: Vor dem ersten Start von <b>XTTSv2</b>, <b>Kokoro</b>, <b>Silero</b> oder <b>Qwen
  3 TTS</b> lädt das Programm die benötigten Modellgewichte und Komponenten automatisch herunter. Den Downloadfortschritt
  kannst du in der Konsole verfolgen.<br><br>Nach dem ersten erfolgreichen Download funktioniert die Sprachgenerierung auch
