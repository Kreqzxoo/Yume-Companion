spotify_title: Spotify
spotify_intro: Verbinde einmalig deine eigene Spotify-App (hier werden weder Passwort noch Secret gespeichert). Yume kann dann Musik starten, pausieren, überspringen und sagen, was läuft – im PC-Dashboard und am Handy. Die Anmeldung wird automatisch an das gekoppelte Handy weitergegeben, du meldest dich nur einmal an. Die Wiedergabe-Steuerung braucht Spotify Premium.
spotify_steps: "1. Öffne das Spotify-Entwicklerportal und erstelle eine App.
2. Trage die unten angezeigte Redirect-URI in dieser App ein (Settings > Redirect URIs) und für das Handy zusätzlich  yume://spotify .
3. Füge die Client-ID der App hier ein und klicke auf „Anmelden“."
