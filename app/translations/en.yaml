section_tool_calling: TOOL CALLING PERMISSIONS
enable_tool_calling_text: Enable Native Tool Calling
enable_tool_calling_tooltip: Allows the AI to execute Python functions natively during generation.
tool_web_title: WebSearchTool
tool_web_desc: Search the web using a stealth DuckDuckGo API to retrieve real-time facts, weather, or news when asked.
tool_browse_web_title: BrowserAgentTool [Playwright]
tool_browse_web_desc: Autonomous web browsing and research via Chromium. Reads clean page text, clicks buttons, fills
  out forms, and downloads files into sandbox.
tool_gui_action_title: GUIActionTool [Computer Use]
tool_gui_action_desc: 'Direct OS & GUI control: mouse movements, clicks, text typing, window scrolling, and keyboard
  hotkeys (Ctrl+S, Enter, Alt+Tab, etc.).'
tool_execute_code_title: ExecuteCodeTool [Code Interpreter]
tool_execute_code_desc: Write and execute Python and PowerShell scripts inside an isolated local sandbox for calculations,
  file processing, and batch tasks.
tool_file_organizer_title: FileOrganizerTool [Workspace Manager]
tool_file_organizer_desc: Inspect desktop/folder contents (.lnk shortcuts, directories, files), search files, and automatically
  organize loose files into categories.
tool_planner_title: TaskPlannerTool [Hierarchical Planner]
tool_planner_desc: Deconstructs complex multi-step user requests into sequential tool chains and executes them with per-step
  safety checks.
tool_app_control_title: AppControlTool
tool_app_control_desc: 'Manage Windows applications and shortcuts: launch programs, open folders/Recycle Bin, focus windows,
  or terminate processes on demand.'
tool_env_snapshot_title: SystemVitalsMonitorTool [Hardware Watchdog]
tool_env_snapshot_desc: Real-time hardware snapshots and background watchdog that proactively alerts on low battery,
  GPU overheating, or finished downloads.
tool_hardware_specs_title: GetHardwareSpecsTool
tool_hardware_specs_desc: Retrieve detailed PC hardware specs (CPU, RAM, GPU, VRAM, and Storage) to evaluate system compatibility
  for games and local AI models.
tool_read_clipboard_title: ClipboardReaderTool
tool_read_clipboard_desc: Read the current text content copied in the user's clipboard for analysis or questions.
tool_url_title: OpenURLTool
tool_url_desc: Open links or websites (like YouTube or GitHub) in your default web browser on demand.
tool_sysinfo_title: GetSystemInfoTool
tool_sysinfo_desc: Retrieve the exact system time and date from your PC to help the AI keep track of the current schedule.
tool_media_title: MediaControlTool
tool_media_desc: Control media playback on your Windows PC (pause, play, next/prev tracks in Spotify, YouTube, or browser
  players).
tool_vision_title: TakeScreenshotTool [Vision]
tool_vision_desc: Analyze active screen contents. Captures a quick screenshot and sends it to a multimodal AI model.
  Extremely performance-heavy!
