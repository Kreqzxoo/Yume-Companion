about_program: About Yume Companion
about_program_title: About Yume Companion
about_program_description: '<b>Yume Companion</b> is a free, open-source desktop program in which AI characters truly
  remember, develop, and live both within the program and on your desktop. Create or import a character once and interact
  with them across three interconnected dimensions:<br><br>• 💬 <b>Interactive text and voice chat:</b> Live 1-on-1 dialogue
  with animated Live2D/VRM avatars, live voice streaming, an adaptive status HUD, file attachments, and tool usage. <br><br>•
  🎲 <b>Yume Stage role-playing engine:</b> Tabletop text-based RPGs run by an AI Game Master with world state tracking,
  inventory management, and dynamic NPCs.<br><br>• 🖥️ <b>Yume Desktop Companion: </b> A standalone character on your desktop
  with a neurohormonal mood model, vision, buffer reading, and tool invocation.<br><br>All dimensions are unified by
  the <b>Yume Memory</b> module—a cognitive memory system with emotional evolution, a personal journal, and automatic
  resolution of contradictions. Runs 100% locally and privately on your PC via GGUF (CUDA, Vulkan, HIP, SYCL) without
  filters or subscriptions, with support for cloud APIs, Discord, and a local web client.'
