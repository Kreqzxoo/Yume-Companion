soul_memory_tooltip: '<b>🧠 Yume Memory</b><br><br>

  Transform your character from a simple AI into a living digital entity with a <b>continuous, lifelong memory</b>. This
  is the cognitive core of the Yume Companion Ecosystem.<br><br>

  Instead of relying on flawed raw-text search, Yume Memory uses an advanced <b>multi-agent architecture</b>:<br>

  • <b>Dual-Core Indexing:</b> Separates the character''s psychology (<i>MEMORY.md</i>) from your user profile and relationship
  metadata (<i>USER.md</i>). This prevents role confusion and optimizes prompt caching.<br>

  • <b>Archivist & Diary:</b> Background agents autonomously compile dense episodic lore topics and write intimate, <i>first-person
  emotional diaries</i> about your interactions.<br>

  • <b>Self-Healing & Decay:</b> Automatically detects and resolves logical inconsistencies in memory over time while
  managing natural emotional transitions.<br><br>

  The result? Zero context bloat and absolute personality consistency. Whether you are in a Yume Stage adventure or relaxing
  with your Yume Desktop Companion, <b>they will remember everything</b>.'
sm_mode_full: Full Synchronization
sm_mode_soul_link: Soul Link
sm_mode_mind_spark: Mind Spark
sm_mode_reflection_flow: Reflection Flow
sm_mode_full_tooltip: '<b>🌌 Full Synchronization</b><br><br>

  Complete cognitive link. Every aspect of the character is active:<br><br>

  • <b>Psychological Index:</b> Real-time mood tracking.<br>

  • <b>Lore Topics:</b> Deep world-building and facts.<br>

  • <b>Diary:</b> First-person emotional reflections.<br><br>

  <i>The ultimate experience. Requires a powerful system or API.</i>'
sm_mode_soul_link_tooltip: '<b>🔗 Soul Link</b><br><br>

  Focuses on personality and emotions.<br><br>

  • Updates the <b>MEMORY.md</b> index to keep the character''s mood and goals consistent.<br>

  • The <b>Diary Agent</b> records their private feelings about you.<br><br>

  <b>What is skipped:</b> The system does not create or update Lore Topics.<br><br>

  <i>Best for: Maintaining a deep bond without heavy CPU/GPU load.</i>'
sm_mode_mind_spark_tooltip: '<b>⚡ Mind Spark</b><br><br>

  Tactical memory for maximum performance.<br><br>

  • Updates <b>ONLY</b> the <b>MEMORY.md</b> index.<br><br>

  Ensures the character remembers who they are, how they feel, and what they want right now.<br><br>

  <b>What is skipped:</b> No diaries or lore files are generated.<br><br>

  <i>Best for: Slow systems or fast-paced roleplay where only logic matters.</i>'
sm_mode_reflection_flow_tooltip: '<b>📓 Reflection Flow</b><br><br>

  Emotional logging with zero impact on chat logic.<br><br>

  • Only the <b>Diary Agent</b> is active.<br><br>

  The character won''t update their "internal state" in the index, but will still write emotional entries in their daily
  diary.<br><br>

  <b>What is skipped:</b> No psychological index or lore updates.<br><br>

  <i>Best for: Maximum speed while keeping a history of the character''s feelings.</i>'
ambient_sound_tooltip: "<b>\U0001F3B5 Ambient Sound Module</b><br><br>\nThis feature adds an <b>atmospheric sound</b>\
  \ when entering a chat with a character.<br><br>\nAfter switching on, you can choose the appropriate <b>ambient</b>\
  \ — background music or sounds that will create the right mood:\nwhether it's a noisy wind, the sound of raindrops\
  \ or the cozy crackle of a campfire.<br><br>\n\n<b>Example:</b><br>\nIf you are chatting with a character in a <i>Tavern</i>,\n\
  you can choose an ambient with <i>the sound of a noisy crowd and a cheerful melody</i>, \nto immerse yourself in the\
  \ atmosphere of the place and strengthen the emotional connection with the character."
sow_system_tooltip: '<b>✨ Yume System</b><br><br>

  This is the <b>advanced mode</b> of the program, which will unleash <b>the full potential</b> of your communication
  with characters.<br><br>

  You can:<br>

  • Assign avatars to characters — static or gif images, animated Live2D models or volumetric VRM models;<br>

  • Call characters — communicate through a microphone in a special interface made specifically for this mode;<br>

  • Connect additional modules: soul memory, ambient, translator and many others.'
personas_button_tooltip: <b>Opens personas editor</b><br><br>Allows you to create, edit, select and delete personas -
  information about the user who will communicate with the characters.
system_prompt_button_tooltip: "Here you can <b>customize the system prompt</b> for the language model — how the character\
  \ should behave during your conversations.<br><br>\n\nYou can:<br>\n• <b>Edit the prompt text</b> — adjust tone, add\
  \ speech patterns or quirks.<br>\n• <b>Reorder components</b> — control the priority of information.<br><br>\n\n<b>Why\
  \ does order matter?</b><br>\nThe model remembers best what appears <b>closer to the end</b> of the prompt.<br>\nIf\
  \ you want the character to reference lore more often — move the Lorebook to the end.<br>\nIf their personality is\
  \ most important — place Character Info last.<br><br>\n\n\U0001F4A1 <i>Use this editor to make the character feel more\
  \ authentic, consistent, and alive. \nTweak the text and order until they speak exactly as they should.</i>"
lorebook_editor_button_tooltip: '<b>Editor of lorebooks</b><br><br>

  A lorebook is a <b>reference book</b> that helps a character remember important events, terms, places, and characters.<br><br>

  When you mention something from the lorebook, the program <b>automatically connects the necessary information</b> to
  the query, and the character responds as if he really knows it.<br><br>


  <b>What you can do:</b><br>

  • <b>Create and delete lorebooks</b>.<br>

  • <b>Add entries</b> — each block of information: place, character, event, term.<br>

  • <b>Edit keywords</b> — what should the entry "include".<br>

  • <b>Choose the scan depth</b> — how many recent messages to analyze for matches.<br><br>


  <b>Example:</b><br>

  You are adding an entry:<br>

  • <i>Text:</i> "Yume Companion is a program that allows you to communicate with AI."<br>

  • <i>Keywords:</i> Yume Companion, AI<br>

  When you say: <i>"What is Yume Companion?"</i>, the character will remember and respond with information about this
  entry.'
gpu_layers_tooltip: '<b>GPU Layer Offloading</b><br><br>

  This setting lets you <b>control how much of the LLM</b> runs directly on your GPU, balancing <b>speed</b> and <b>video
  memory usage</b>.<br><br>

  The more layers loaded into VRAM, the faster the model responds — but the higher the GPU memory demand.<br>

  You can manually adjust how many layers are offloaded, making it possible to run large models even on mid-range GPUs.<br><br>

  💡 <i>Especially useful for large models. The stronger your GPU, the more layers you can assign.</i>'
context_size_tooltip: '<b>Context Window</b><br><br>

  This is the maximum number of tokens the model can process at once (its working memory). It includes chat history,
  author''s notes, and lorebook entries.<br><br>

  Select the highest value for unlimited context (API) or to automatically detect the largest available context window
  for your local language model.<br><br>

  A larger context window allows the character to <b>remember more</b>, but significantly increases VRAM usage.<br><br>

  💡 <i>Lower this value on weaker PCs. For long-term memory, keep the ''Yume Memory'' module enabled instead of maxing
  out the context size.</i>'
mlock_tooltip: '<b>MLock (Memory Lock)</b><br><br>

  This feature <b>prevents the language model from being unloaded</b> from your system''s RAM into the swap file on your
  storage drive.<br><br>

  When enabled, the model stays fully loaded in memory, ensuring the <b>fastest possible response time</b> without micro-stutters
  during message generation.<br><br>

  💡 <i>Recommended only if you have plenty of system RAM, as it permanently reserves that memory. Disable it on low-RAM
  systems.</i>'
no_mmap_tooltip: '<b>No MMAP Mode (Direct RAM Load)</b><br><br>

  By default, models are loaded using memory mapping (<b>mmap</b>), which means parts of the model are read from your
  storage drive on-demand during generation.<br><br>

  Enabling this option forces the system to <b>load the entire model into RAM</b> upfront.<br>

  This slightly increases initial load time and RAM usage, but prevents micro-stutters and delays during text generation.<br><br>

  💡 <i>Highly recommended if you have enough system RAM. Keep it disabled on low-RAM systems to avoid out-of-memory crashes.</i>'
reasoning_mode_tooltip: '<b>Thinking / Reasoning Mode (&lt;think&gt;)</b><br><br>

  When enabled, the AI model will output its internal thought process inside <b>&lt;think&gt;</b> tags before providing
  the final response.<br><br>

  This dramatically improves the model''s logic, math, and problem-solving abilities by allowing it to "reason" step-by-step.<br>

  However, it consumes more tokens and increases response time, as the model generates its hidden thoughts first.<br><br>

  💡 <i>Enable this for complex tasks, puzzles, or deep roleplay logic. Disable it for simple, fast chatting.</i>'
flashattention_tooltip: '<b>Flash Attention</b><br><br>

  This technology <b>speeds up the AI</b> and <b>reduces VRAM usage</b> when processing long conversations.<br><br>

  It optimizes computations, making text generation highly efficient with large context windows.<br><br>

  💡 <i>Highly recommended to keep enabled for maximum performance.</i>'
max_tokens_tooltip: '<b>Max Response Length</b><br><br>

  Controls <b>how long the character''s reply can be</b>.<br><br>

  💡 <i>Very long responses eat up context space. Recommended: 300–500 tokens.</i>'
reasoning_effort_tooltip: '<b>Reasoning Effort</b><br><br>

  Controls how much internal reasoning cloud reasoning models are allowed to do before answering.<br>

  Applies to OpenAI o-series/GPT-5, Claude extended thinking, Gemini, Grok, DeepSeek, Qwen and GLM reasoning models.'
custom_args_tooltip: '<b>Custom Backend Arguments</b><br><br>

  Allows you to pass additional command-line arguments directly to the local LLM server (llama.cpp).<br><br>

  This is intended for advanced users who want to fine-tune specific engine parameters (like RoPE scaling or cache settings)
  that are not exposed in the UI.<br><br>

  💡 <i>Use with caution. Incorrect flags can crash the server or override your UI settings. Example: <b>--rope-freq-base
  10000</b></i>'
chat_template_tooltip: '<b>Chat Template</b><br><br>

  Determines how the system formats your conversation before sending it to the AI. Different models are trained on specific
  formats.<br><br>

  If the wrong template is used, the AI might hallucinate or output weird symbols (like <code>&lt;|im_end|&gt;</code>).<br><br>

  💡 <i>''Auto'' reads the template directly from the GGUF file. If the model acts weirdly, try forcing a specific template
  like ''ChatML'' or ''Llama-3''.</i>'
stop_strings_tooltip: '<b>Stop Strings</b><br><br>

  A list of words or symbols that force the AI to <b>instantly stop generating text</b>.<br><br>

  This is a crucial tool to prevent the AI from speaking or acting on your behalf (e.g., generating <code>\nUser:</code>
  and answering for you).<br><br>

  💡 <i>Separate with commas. Example: <code>\nUser:, &lt;/s&gt;, &lt;|eot_id|&gt;</code></i>'
temperature_tooltip: '<b>Temperature (Creativity)</b><br><br>

  Controls the basic randomness of the AI''s responses.<br><br>

  • <b>Low (0.1–0.5):</b> Logical and predictable. Boring for roleplay.<br>

  • <b>High (0.8–1.5):</b> Highly creative, expressive, and unpredictable.<br><br>

  💡 <i>Recommended: 0.8–1.0. For higher values, be sure to use <b>Min-P</b> to cut off nonsensical words.</i>'
freq_penalty_tooltip: '<b>Frequency Penalty</b><br><br>

  Penalizes words based on <b>how many times they have already appeared</b> in the text.<br><br>

  This forces the AI to use a richer vocabulary and search for synonyms rather than repeating the same adjectives.<br><br>

  💡 <i>Too high values will break grammar. Recommended: 0.0 - 0.5.</i>'
pres_penalty_tooltip: '<b>Presence Penalty</b><br><br>

  Applies a flat penalty to a word if it has appeared <b>at least once</b>.<br><br>

  Unlike Frequency Penalty, this encourages the AI to <b>change the subject</b> and introduce new concepts, preventing
  the conversation from getting stuck in a loop.<br><br>

  💡 <i>High values make the AI jump between topics erratically. Recommended: 0.0 - 0.4.</i>'
min_p_tooltip: '<b>Min-P (Smart Cutoff)</b><br><br>

  The new gold standard for Roleplay. It cuts off garbage words dynamically based on the probability of the best possible
  word.<br><br>

  If the AI is confident, it ruthlessly cuts out nonsense. If it needs to be creative, it lowers the barrier to let good
  synonyms in.<br><br>

  💡 <i>Replaces Top-P. Set Top-P to 1.0 and use Min-P at <b>0.05 - 0.10</b> for perfect logic with high Temperature.</i>'
top_p_tooltip: '<b>Top-P</b><br><br>

  An older sampling method that limits word choices to a cumulative percentage.<br><br>

  💡 <i>If you are using <b>Min-P</b>, it is highly recommended to disable Top-P by setting it to <b>1.0</b>.</i>'
dyn_temp_min_tooltip: '<b>Dynamic Temperature (Min/Max)</b><br><br>

  Instead of a fixed value, the Temperature shifts dynamically between the Min and Max bounds based on the AI''s confidence.<br><br>

  When stating facts, the temperature drops to remain logical. When describing emotions, it spikes to become creative.'
dyn_temp_max_tooltip: '<b>Dynamic Temperature (Min/Max)</b><br><br>

  Instead of a fixed value, the Temperature shifts dynamically between the Min and Max bounds based on the AI''s confidence.<br><br>

  When stating facts, the temperature drops to remain logical. When describing emotions, it spikes to become creative.'
xtc_prob_tooltip: '<b>XTC (Exclude Top Choices)</b><br><br>

  A revolutionary feature for roleplayers. It forcibly <b>removes the most obvious, cliché words</b> from the AI''s choices.<br><br>

  Sick of the AI saying <i>"shivers sent down my spine"</i> or <i>"predatory smirk"</i>? XTC forces the model to find
  unique, literary alternatives, making the speech incredibly lifelike.<br><br>

  💡 <i><b>Probability:</b> The chance XTC triggers (Try 0.3 - 0.5).</i>'
xtc_thresh_tooltip: '<b>XTC Threshold</b><br><br>

  Determines how "popular" a word must be before XTC is allowed to remove it.<br><br>

  💡 <i>Recommended: 0.1 (Only words with >10% probability can be removed).</i>'
dry_mult_tooltip: '<b>DRY (Don''t Repeat Yourself)</b><br><br>

  Unlike older penalties that target single words, DRY recognizes and penalizes <b>entire repeating sequences and sentence
  structures</b>.<br><br>

  If your Waifu keeps starting every message with <i>"I sigh and look at you"</i>, DRY will catch this pattern and force
  her to act differently.<br><br>

  💡 <i><b>Multiplier:</b> Penalty strength (Try 0.8).</i>'
dry_base_tooltip: '<b>DRY Base</b><br><br>

  The scaling factor for the DRY algorithm. Determines how aggressively the penalty scales with sequence length.<br><br>

  💡 <i>Recommended: 1.75</i>'
dry_length_tooltip: '<b>DRY Allowed Length</b><br><br>

  The number of tokens allowed to repeat before the DRY penalty activates.<br><br>

  💡 <i>Recommended: 2 (Prevents penalizing common two-word phrases like "I am").</i>'
kv_cache_tooltip: Quantize Context Cache to save massive amounts of VRAM on long contexts.
batch_size_tooltip: 'Tokens processed at once during prompt evaluation.<br><br>

  512 is safe. Higher = faster load, more VRAM.'
cpu_threads_tooltip: '0 = Auto.<br><br>

  Set to your physical CPU core count for optimal inference speed on CPU.'
cpu_moe_layers_tooltip: 0 = Disabled. How many Mixture of Experts (MoE) layers to keep in CPU RAM. Essential for huge
  MoE models.
auto_summary_tooltip: This setting allows you to specify the number of messages after which a summary of your chat will
  be generated.
attach_file_tooltip: Attach an image or a document to your message
