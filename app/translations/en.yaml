section_arcs: Story Arcs
hint_arcs_format: This is where you gate your plot. An arc in "locked" stage does not exist for any character — nobody
  will mention it or hint at it. Set it to "available" once the player has found the lead that should unlock it, or "active"
  once it's fully underway. "trigger" is a note to the GM about what should cause the unlock — it is never shown to characters.
section_relationships: Relationships
hint_relationships_format: How one character feels about and perceives another — usually a party member or NPC's view
  of PLAYER, but it can be between any two actors. This is injected directly into that character's own prompt, so it's
  never forgotten. Affinity runs -100 (hostile) to 100 (devoted). "role" is how the subject currently sees the target's
  status or title — independent of affinity.
field_relationships: Relationships
field_relationships_hint: 'Format: "subject -> target | affinity(-100..100) | role_view | tag1, tag2"'
section_character_states: Character States
hint_overlays_format: A character's own evolving state — their current role/title and any personal facts worth tracking
  (loyalty, a secret, an internal conflict). This travels with the character and shows up in their own prompt, separate
  from the static character card.
