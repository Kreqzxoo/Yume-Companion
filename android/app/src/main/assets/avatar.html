<!DOCTYPE html>
<html style="width: 100%; height: 100%;">
	<head>
		<meta charset="utf-8" />
		<title>Soul of Waifu VRM</title>
		<meta name="viewport" />
		<style>
			html, body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                width: 100%;
                height: 100%;
                background-color: rgb(27, 27, 27);
            }
            canvas {
                display: block;
                width: 100%;
                height: 100%;
                position: absolute;
                top: 0;
                left: 0;
				background-color: rgb(27, 27, 27);
            }
			#background {
				position: absolute;
				width: 100%;
				height: 100%;
				z-index: -1;
			}
		</style>
	</head>
	<body>
		<div id="background"></div>

		<script type="importmap">
			{
				"imports": {
					"three": "./vrm/modules/three.module.js",
					"three/addons/": "./vrm/modules/addons/",
					"@pixiv/three-vrm": "./vrm/modules/three-vrm.module.js",
					"idleGestures": "./vrm/modules/idleGestures.js",
					"loadMixamo": "./vrm/modules/loadMixamoAnimation.js"
				}
			}
		</script>
		<script type="module">
			import * as THREE from 'three';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { VRMLoaderPlugin, VRMUtils, VRMHumanoid, VRMLookAt } from '@pixiv/three-vrm';
			import { loadMixamoAnimation } from 'loadMixamo';
			import { createIdleGestures } from 'idleGestures';

			// ---- Yume Android bridge: reports loading / errors to the app ----
			const _ce = console.error.bind(console);
			console.error = (...a) => { _ce(...a); try { if (window.YumeBridge) YumeBridge.log(a.map(String).join(' ')); } catch (e) {} };
			window.addEventListener('unhandledrejection', (e) => { try { if (window.YumeBridge) YumeBridge.log('promise: ' + ((e.reason && e.reason.message) || e.reason)); } catch (x) {} });
			if (new URLSearchParams(location.search).get('bg') === '1') {
				document.documentElement.style.background = 'radial-gradient(ellipse at 50% 30%, rgba(255,143,199,0.30), rgba(255,143,199,0) 62%), linear-gradient(180deg, #2a1640 0%, #170d27 100%)';
				document.body.style.background = 'transparent';
			}
			if (new URLSearchParams(location.search).get('transparent') === '1') {
				const st = document.createElement('style'); st.textContent = 'canvas { background-color: transparent !important; }'; document.head.appendChild(st);
			}
			window.onVrmLoaded = () => { try { if (window.setView) { window.setView(window.__mode || 'bust'); setTimeout(() => window.setView(window.__mode), 1600); setTimeout(() => window.setView(window.__mode), 4500); } if (window.YumeBridge) YumeBridge.avatarState('VRM', true); } catch (e) {} };

			const urlParams = new URLSearchParams(window.location.search);
			const isTransparent = urlParams.get('transparent') === '1';

			if (isTransparent) {
				document.body.style.backgroundColor = 'rgba(0,0,0,0)';
				document.documentElement.style.backgroundColor = 'rgba(0,0,0,0)';
				const canvas = document.querySelector('canvas');
				if (canvas) canvas.style.backgroundColor = 'rgba(0,0,0,0)';
			}

			const mixamoVRMRigMap = {
				mixamorigHips: 'hips',
				mixamorigSpine: 'spine',
				mixamorigSpine1: 'chest',
				mixamorigSpine2: 'upperChest',
				mixamorigNeck: 'neck',
				mixamorigHead: 'head',
				mixamorigLeftShoulder: 'leftShoulder',
				mixamorigLeftArm: 'leftUpperArm',
				mixamorigLeftForeArm: 'leftLowerArm',
				mixamorigLeftHand: 'leftHand',
				mixamorigLeftHandThumb1: 'leftThumbMetacarpal',
				mixamorigLeftHandThumb2: 'leftThumbProximal',
				mixamorigLeftHandThumb3: 'leftThumbDistal',
				mixamorigLeftHandIndex1: 'leftIndexProximal',
				mixamorigLeftHandIndex2: 'leftIndexIntermediate',
				mixamorigLeftHandIndex3: 'leftIndexDistal',
				mixamorigLeftHandMiddle1: 'leftMiddleProximal',
				mixamorigLeftHandMiddle2: 'leftMiddleIntermediate',
				mixamorigLeftHandMiddle3: 'leftMiddleDistal',
				mixamorigLeftHandRing1: 'leftRingProximal',
				mixamorigLeftHandRing2: 'leftRingIntermediate',
				mixamorigLeftHandRing3: 'leftRingDistal',
				mixamorigLeftHandPinky1: 'leftLittleProximal',
				mixamorigLeftHandPinky2: 'leftLittleIntermediate',
				mixamorigLeftHandPinky3: 'leftLittleDistal',
				mixamorigRightShoulder: 'rightShoulder',
				mixamorigRightArm: 'rightUpperArm',
				mixamorigRightForeArm: 'rightLowerArm',
				mixamorigRightHand: 'rightHand',
				mixamorigRightHandPinky1: 'rightLittleProximal',
				mixamorigRightHandPinky2: 'rightLittleIntermediate',
				mixamorigRightHandPinky3: 'rightLittleDistal',
				mixamorigRightHandRing1: 'rightRingProximal',
				mixamorigRightHandRing2: 'rightRingIntermediate',
				mixamorigRightHandRing3: 'rightRingDistal',
				mixamorigRightHandMiddle1: 'rightMiddleProximal',
				mixamorigRightHandMiddle2: 'rightMiddleIntermediate',
				mixamorigRightHandMiddle3: 'rightMiddleDistal',
				mixamorigRightHandIndex1: 'rightIndexProximal',
				mixamorigRightHandIndex2: 'rightIndexIntermediate',
				mixamorigRightHandIndex3: 'rightIndexDistal',
				mixamorigRightHandThumb1: 'rightThumbMetacarpal',
				mixamorigRightHandThumb2: 'rightThumbProximal',
				mixamorigRightHandThumb3: 'rightThumbDistal',
				mixamorigLeftUpLeg: 'leftUpperLeg',
				mixamorigLeftLeg: 'leftLowerLeg',
				mixamorigLeftFoot: 'leftFoot',
				mixamorigLeftToeBase: 'leftToes',
				mixamorigRightUpLeg: 'rightUpperLeg',
				mixamorigRightLeg: 'rightLowerLeg',
				mixamorigRightFoot: 'rightFoot',
				mixamorigRightToeBase: 'rightToes'
			};
			
			const _v3A = new THREE.Vector3();

			class VRMSmoothLookAt extends VRMLookAt {
				constructor(humanoid, applier) {
					super(humanoid, applier);
					this.smoothFactor = 10.0;
					
					this.yawLimit = 45.0;
					this.pitchLimit = 45.0;
					
					this._yawDamped = 0.0;
					this._pitchDamped = 0.0;
				}

				update(delta) {

					if (this.target && this.autoUpdate) {

						this.lookAt( this.target.getWorldPosition( _v3A ) );

						if (
							this.yawLimit < Math.abs( this._yaw ) ||
							this.pitchLimit < Math.abs( this._pitch )
						) {
							this._yaw = 0.0;
							this._pitch = 0.0;
						}

						const k = 1.0 - Math.exp( - this.smoothFactor * delta );

						this._yawDamped += ( this._yaw - this._yawDamped ) * k;
						this._pitchDamped += ( this._pitch - this._pitchDamped ) * k;

						this.applier.applyYawPitch( this._yawDamped, this._pitchDamped );

						this._needsUpdate = false;

					}

					if ( this._needsUpdate ) {

						this._needsUpdate = false;
						this.applier.applyYawPitch( this._yaw, this._pitch );

					}
				}
			}

			const renderer = new THREE.WebGLRenderer({
				antialias: true,
				alpha: isTransparent,
				premultipliedAlpha: isTransparent ? false : true
			});
			renderer.setClearColor(0x000000, isTransparent ? 0 : 1);
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.outputEncoding = THREE.sRGBEncoding;
			renderer.physicallyCorrectLights = true;
			renderer.shadowMap.enabled = true;
			document.body.appendChild(renderer.domElement);

			// init camera
			const camera = new THREE.PerspectiveCamera(30.0, window.innerWidth / window.innerHeight, 0.1, 1000.0);
			camera.position.set(0.0, 1.0, 5.0);

			// init camera controls
			const controls = new OrbitControls(camera, renderer.domElement);
			controls.screenSpacePanning = true;
			controls.target.set(0.0, 1.0, 0.0);
			controls.update();
			if (urlParams.get('static') === '1') { controls.enabled = false; }
			window.__camera = camera; window.__controls = controls;
			// frame the upper body ("bust") or the whole figure ("full") whatever size the model has
			window.__zoom = 1.0; window.__mode = 'bust';
			window.setZoom = function (z) { window.__zoom = Math.max(0.3, Math.min(2.0, Number(z) || 1)); window.setView(window.__mode); };
			window.setView = function (mode) {
				window.__mode = mode || 'bust';
				const v = (typeof currentVrm !== 'undefined') ? currentVrm : null;
				const z = window.__zoom;
				if (!v || !v.humanoid) { camera.position.set(0, 1.0, 5.0 / z); controls.target.set(0, 1.0, 0); controls.update(); return; }
				const pos = (n) => { const o = v.humanoid.getNormalizedBoneNode(n); const w = new THREE.Vector3(); if (o) o.getWorldPosition(w); return w; };
				const head = pos('head'), hips = pos('hips'), foot = pos('leftFoot');
				// centre on the middle between the shoulders: the idle animation moves the body a little off the origin, the head sways
				const cx = (pos('leftUpperArm').x + pos('rightUpperArm').x) / 2;
				const height = Math.max(0.5, head.y - hips.y);                        // hips -> head bone
				const full = window.__mode === 'full';
				const frame = (full ? Math.max(1.2, head.y - foot.y + 0.4) : height * 1.55) / z;   // visible height
				const k = 2 * Math.tan((camera.fov * Math.PI / 180) / 2);
				const dist = Math.max(frame / k, ((full ? height * 1.4 : height * 1.15) / z) / (k * Math.max(0.2, camera.aspect)));
				const top = head.y + 0.34 / z;                                          // room above the head (long hair, ribbons ...)
				const ty = top - frame / 2;
				controls.target.set(cx, ty, head.z);
				camera.position.set(cx, ty, head.z + dist);
				controls.update();
			};

			// init scene
			const scene = new THREE.Scene();
			
			// init lookAt
			const lookAtTarget = new THREE.Object3D();
			camera.add(lookAtTarget);
			scene.add(camera);

			let targetMouseX = 0;
			let targetMouseY = 0;
			let isThinking = false;

			document.addEventListener('mousemove', (event) => {
				targetMouseX = (event.clientX / window.innerWidth) * 2 - 1;
				targetMouseY = -(event.clientY / window.innerHeight) * 2 + 1;
			});

			setInterval(() => {
				if (isThinking) return;
				
				if (Math.random() > 0.4) {
					jitterX = (Math.random() - 0.5) * 0.8;
					jitterY = (Math.random() - 0.5) * 0.5;
					
					if (currentVrm && currentVrm.expressionManager) {
						if (!VRM_OPTS.natural) currentVrm.expressionManager.setValue('relaxed', Math.random() * 0.15);
					}
				} else {
					jitterX = 0;
					jitterY = 0;
				}
			}, 2500 + Math.random() * 2000);
        
			// init lighting
			const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
			scene.add(ambientLight);
			
			const directionalLight = new THREE.DirectionalLight(0xffffff, Math.PI);
			directionalLight.position.set(1, 1, 1).normalize();
			directionalLight.castShadow = true;
			scene.add(directionalLight);

			// background system
			let currentBackground = null;

			function setBackground(type, color = null, url = null) {
				console.log("[DEBUG] setBackground called with:", { type, color, url });

				if (currentBackground) {
					console.log("[DEBUG] Disposing previous background...");

					if (currentBackground instanceof THREE.Texture) {
						currentBackground.dispose();
					}

					scene.background = null;

					const bgElement = document.getElementById('background');
					if (bgElement) {
						bgElement.style.background = '';
					}
				}

				switch(type) {
					case 'color':
						console.log("[DEBUG] Setting solid color background to:", color);
						scene.background = new THREE.Color(color);
						break;

					case 'image':
						if (!url) {
							console.warn("[DEBUG] Image URL is empty!");
							return;
						}
						console.log("[DEBUG] Loading image from:", url);

						const loader = new THREE.TextureLoader();
						loader.load(url, (texture) => {
							texture.encoding = THREE.sRGBEncoding;

							texture.wrapS = THREE.ClampToEdgeWrapping;
							texture.wrapT = THREE.ClampToEdgeWrapping;
							texture.minFilter = THREE.LinearFilter;
							texture.magFilter = THREE.LinearFilter;

							scene.background = texture;
							currentBackground = texture;
							
							console.log("[DEBUG] Background image loaded and applied.");
						}, undefined, (err) => {
							console.error("[ERROR] Failed to load background image:", err);
						});
						break;

					default:
						console.log("[DEBUG] Resetting background.");
						scene.background = null;
				}

				currentBackground = type;
			}

			window.setBackground = setBackground;

			// Loaders
			let currentVrm = undefined;
			let currentAnimationUrl = undefined;
			let currentMixer = undefined;
			let currentAction = undefined;
			let idleAnimation = null;
			const idleAnimationUrl = "/app/utils/emotions/vrm/expressions/neutral.fbx";
			let isPlayingOneShot = undefined;
			let currentExpression = "neutral";
    		const availableExpressions = ["angry", "happy", "neutral", "relaxed", "sad", "surprised"];

			// ================= Natural motion layer (Yume) =================
			const VRM_OPTS = { natural: true, intensity: 1.0, idle: 0.6, eyeContact: true, blink: 1.0, hold: 25, animations: true };
			// emotion -> expression weights (VRM presets) + head pose [pitch down, yaw, roll] in degrees
			const EMOTION_BLENDS = {
				neutral:        { w: {},                                  h: [0, 0, 0] },
				admiration:     { w: { happy: 0.5, relaxed: 0.25 },       h: [-2, 0, 2] },
				amusement:      { w: { happy: 0.85 },                     h: [-3, 0, 3] },
				anger:          { w: { angry: 0.9 },                      h: [3, 0, 0] },
				annoyance:      { w: { angry: 0.45 },                     h: [1, 6, 2] },
				approval:       { w: { happy: 0.4, relaxed: 0.3 },        h: [3, 0, 0] },
				caring:         { w: { relaxed: 0.6, happy: 0.25 },       h: [2, 0, 5] },
				confusion:      { w: { surprised: 0.25, sad: 0.2 },       h: [0, 4, 7] },
				curiosity:      { w: { surprised: 0.3, happy: 0.15 },     h: [-2, 0, 7] },
				desire:         { w: { relaxed: 0.5, happy: 0.3 },        h: [2, 0, 4] },
				disappointment: { w: { sad: 0.55, relaxed: 0.1 },         h: [5, 0, 0] },
				disapproval:    { w: { angry: 0.3, sad: 0.15 },           h: [0, 8, 0] },
				disgust:        { w: { angry: 0.5, sad: 0.2 },            h: [-2, 10, 0] },
				embarrassment:  { w: { happy: 0.35, sad: 0.2, surprised: 0.1 }, h: [6, 10, 5] },
				excitement:     { w: { happy: 0.9, surprised: 0.25 },     h: [-3, 0, 0] },
				fear:           { w: { surprised: 0.5, sad: 0.4 },        h: [4, 0, 0] },
				gratitude:      { w: { happy: 0.5, relaxed: 0.4 },        h: [5, 0, 3] },
				grief:          { w: { sad: 0.95 },                       h: [8, 0, 0] },
				joy:            { w: { happy: 0.9 },                      h: [-3, 0, 2] },
				love:           { w: { happy: 0.6, relaxed: 0.35 },       h: [2, 0, 6] },
				nervousness:    { w: { sad: 0.25, surprised: 0.2 },       h: [4, 6, 2] },
				optimism:       { w: { happy: 0.55, relaxed: 0.2 },       h: [-3, 0, 0] },
				pride:          { w: { happy: 0.5, angry: 0.1 },          h: [-6, 0, 0] },
				realization:    { w: { surprised: 0.5 },                  h: [-3, 0, 0] },
				relief:         { w: { relaxed: 0.7, happy: 0.2 },        h: [4, 0, 0] },
				remorse:        { w: { sad: 0.7 },                        h: [8, 0, 0] },
				surprise:       { w: { surprised: 0.9 },                  h: [-4, 0, 0] },
				sadness:        { w: { sad: 0.8 },                        h: [6, 0, 0] }
			};
			const exprTarget = { happy: 0, angry: 0, sad: 0, relaxed: 0, surprised: 0 };
			const exprCur = { happy: 0, angry: 0, sad: 0, relaxed: 0, surprised: 0 };
			let headTarget = { x: 0, y: 0, z: 0 };
			let headCur = { x: 0, y: 0, z: 0 };
			let emotionHold = 0;
			let mouthTarget = 0, mouthCur = 0, visemeTimer = 0, visemeMix = { aa: 1, oh: 0, ih: 0, ee: 0 };
			let stateBias = 'STOPPED';
			let thinkSide = 1;
			setInterval(() => { thinkSide = Math.random() > 0.5 ? 1 : -1; }, 1600);

			window.setVrmOptions = function(opts) {
				Object.assign(VRM_OPTS, opts || {});
				if (currentVrm && currentVrm.lookAt) {
					currentVrm.lookAt.target = VRM_OPTS.eyeContact ? camera : lookAtTarget;
				}
				return VRM_OPTS;
			};

			function setEmotion(name, intensity = 1.0) {
				name = String(name || 'neutral').toLowerCase();
				const def = EMOTION_BLENDS[name]
					|| (availableExpressions.includes(name) ? { w: { [name]: 0.85 }, h: [0, 0, 0] } : EMOTION_BLENDS.neutral);
				const k = Math.max(0, Math.min(1.4, Number(intensity) * VRM_OPTS.intensity));
				for (const key in exprTarget) exprTarget[key] = Math.min(1, (def.w[key] || 0) * k);
				headTarget = { x: def.h[0] * k, y: def.h[1] * k, z: def.h[2] * k };
				currentExpression = (name === 'neutral') ? 'neutral' : name;
				emotionHold = VRM_OPTS.hold;
				return { success: true };
			}
			window.setEmotion = setEmotion;

			async function setExpression(expression, duration = 0.3) {
				if (VRM_OPTS.natural) {
					return setEmotion(expression, 1.0);
				}
				return legacySetExpression(expression, duration);
			}

			function naturalBlink() {
				if (!currentVrm || !currentVrm.expressionManager) return;
				const em = currentVrm.expressionManager;
				const dur = 90 + Math.random() * 90;
				em.setValue('blink', 1.0);
				setTimeout(() => { if (!isThinking && currentVrm) em.setValue('blink', 0.0); }, dur);
				if (Math.random() < 0.12) {                       // occasional double blink
					setTimeout(() => {
						if (!currentVrm) return;
						em.setValue('blink', 1.0);
						setTimeout(() => { if (currentVrm) em.setValue('blink', 0.0); }, 100);
					}, dur + 170);
				}
				setTimeout(blink, (2200 + Math.random() * 4200) / Math.max(0.3, VRM_OPTS.blink));
			}

			function updateNaturalExpr(dt, time) {
				if (!VRM_OPTS.natural || !currentVrm || !currentVrm.expressionManager) return;
				const em = currentVrm.expressionManager;
				if (emotionHold > 0) {
					emotionHold -= dt;
				} else {                                            // drift back to a relaxed neutral face
					const d = Math.max(0, 1 - dt * 0.45);
					for (const key in exprTarget) exprTarget[key] *= d;
					headTarget.x *= d; headTarget.y *= d; headTarget.z *= d;
				}
				const f = 1 - Math.exp(-dt * 5.0);
				for (const key in exprCur) {
					exprCur[key] += (exprTarget[key] - exprCur[key]) * f;
					let v = exprCur[key];
					if (key === 'relaxed') {                         // soft idle smile that breathes
						v = Math.max(v, (0.5 + 0.5 * Math.sin(time * 0.35)) * 0.12 * VRM_OPTS.idle);
					}
					em.setValue(key, Math.max(0, Math.min(1, v)));
				}
				// mouth: fast attack, slower release, with viseme variety instead of a single "aa"
				mouthCur += (mouthTarget - mouthCur) * (1 - Math.exp(-dt * (mouthTarget > mouthCur ? 32 : 14)));
				visemeTimer -= dt;
				if (visemeTimer <= 0) {
					visemeTimer = 0.07 + Math.random() * 0.08;
					const r = Math.random();
					visemeMix = r < 0.5 ? { aa: 1, oh: 0, ih: 0, ee: 0 } : r < 0.72 ? { aa: 0.35, oh: 0.75, ih: 0, ee: 0 }
						: r < 0.88 ? { aa: 0.3, oh: 0, ih: 0.8, ee: 0 } : { aa: 0.3, oh: 0, ih: 0, ee: 0.8 };
				}
				if (mouthCur > 0.02) {
					for (const vk in visemeMix) em.setValue(vk, Math.min(1, mouthCur * visemeMix[vk]));
				} else {
					for (const vk in visemeMix) em.setValue(vk, 0);
				}
			}

			const _qTmp = new THREE.Quaternion();
			const _eTmp = new THREE.Euler();
			function overlayBone(name, rx, ry, rz) {
				const h = currentVrm.humanoid;
				const bone = (h.getRawBoneNode ? h.getRawBoneNode(name) : h.getNormalizedBoneNode(name));
				if (!bone) return;
				_eTmp.set(rx, ry, rz, 'XYZ');
				_qTmp.setFromEuler(_eTmp);
				bone.quaternion.multiply(_qTmp);                   // raw bones are rewritten from the animation every frame
			}

			function updateNaturalBones(dt, time) {
				if (!VRM_OPTS.natural || !currentVrm || !currentVrm.humanoid) return;
				const idle = VRM_OPTS.idle;
				const rad = Math.PI / 180;
				let bx = 0, by = 0, bz = 0;
				if (stateBias === 'LISTENING') { bx = 2.5; bz = 3; }
				else if (stateBias === 'PROCESSING') { bx = -4; by = -8 * thinkSide; bz = 4 * thinkSide; }
				const speak = Math.min(1, mouthCur * 1.4);
				const f = 1 - Math.exp(-dt * 3.5);
				headCur.x += (headTarget.x + bx - headCur.x) * f;
				headCur.y += (headTarget.y + by - headCur.y) * f;
				headCur.z += (headTarget.z + bz - headCur.z) * f;
				const breath = Math.sin(time * 1.55);
				const sway = Math.sin(time * 0.37) * 0.6 + Math.sin(time * 0.91 + 1.3) * 0.4;
				const nod = speak * Math.sin(time * 5.2) * 1.4 * idle;
				overlayBone('spine', breath * 0.010 * idle, sway * 0.012 * idle, 0);
				overlayBone('chest', breath * 0.016 * idle, 0, sway * 0.008 * idle);
				overlayBone('upperChest', breath * 0.010 * idle, 0, 0);
				overlayBone('neck', (headCur.x * 0.35 + nod * 0.4) * rad, headCur.y * 0.35 * rad, headCur.z * 0.35 * rad);
				overlayBone('head',
					(headCur.x * 0.65 + nod + Math.sin(time * 0.53) * 0.8 * idle) * rad,
					(headCur.y * 0.65 + sway * 2.2 * idle) * rad,
					(headCur.z * 0.65 + Math.sin(time * 0.41 + 0.7) * 0.9 * idle) * rad);
				overlayBone('leftShoulder', 0, 0, breath * 0.008 * idle);
				overlayBone('rightShoulder', 0, 0, -breath * 0.008 * idle);
			}


			window.vrmLoaded = false;

			const loader = new GLTFLoader();
			loader.register(parser => new VRMLoaderPlugin(parser));

			function setupModelOptimizations(model) {
				model.traverse((obj) => {
					obj.frustumCulled = false;

					if (obj.isMesh) {
						obj.material.depthWrite = true;
						obj.material.depthTest = true;
						obj.material.precision = 'highp';
						obj.material.antialias = true;

						obj.castShadow = true;
						obj.receiveShadow = true;
					}
				});
			}

            let modelPath = decodeURIComponent(urlParams.get('model'));

            if (!modelPath) {
				console.error("The 'model' parameter was not found in the URL");
				alert("The VRM module for display is not specified");
			} else {
				console.log("Loading a VRM model from:", modelPath);
				loader.load(modelPath, gltf => {
					const vrm = gltf.userData.vrm;
					
					VRMUtils.removeUnnecessaryVertices(gltf.scene);
					VRMUtils.combineSkeletons(gltf.scene);
					VRMUtils.combineMorphs(vrm);

					setupModelOptimizations(gltf.scene);
					
					vrm.scene.traverse(obj => obj.frustumCulled = false);
					currentVrm = vrm;

					const smoothLookAt = new VRMSmoothLookAt( vrm.humanoid, vrm.lookAt.applier );
					smoothLookAt.copy( vrm.lookAt );
					vrm.lookAt = smoothLookAt;
					
					scene.add(vrm.scene);
					console.log("VRM model loaded successfully");
					window.vrmLoaded = true; 
					
					if (window.onVrmLoaded) {
						
						window.onVrmLoaded();
					
					}

					vrm.lookAt.target = camera;
					
					currentMixer = new THREE.AnimationMixer( currentVrm.scene );
					
					blink();

					loadFBX(idleAnimationUrl).then(() => {
						console.log("Idle animation is loaded and ready to use");
					}).catch(error => {
						console.error("Error loading idle animation:", error);
					});

					vrm.scene.traverse( ( obj ) => {

						obj.frustumCulled = false;

					} );

					VRMUtils.rotateVRM0( vrm );
					console.log( vrm );
					
					animate();
				}, progress => {
					const percent = Math.round(progress.loaded / progress.total * 100);
					console.log(`Loading the model... ${percent}%`);
				}, error => {
					console.error("Error loading the VRM:", error);
					alert("Couldn't load the model. Check the file path or format");
				});
			}

			function blink() {
				if (VRM_OPTS.natural) { return naturalBlink(); }
				if (currentExpression === 'happy' || currentExpression === 'sad') {
					setTimeout(blink, 2000);
					return;
				}

				var blinktimeout = Math.floor(Math.random() * 250) + 50;
				setTimeout(() => {
					currentVrm.expressionManager.setValue("blink",0);
				}, blinktimeout);

				currentVrm.expressionManager.setValue("blink",1.0);

				var rand = Math.round(Math.random() * 10000) + 1000;
				setTimeout(function () {
						blink();
				}, rand);
			}

			async function legacySetExpression(expression, duration = 0.3) {
				if (!currentVrm || !currentVrm.expressionManager) {
					console.error("The VRM model or expression manager is not loaded");
					return { success: false, error: "The model is not ready" };
				}

				expression = expression.toLowerCase();
				
				if (!availableExpressions.includes(expression)) {
					console.error("Unknown expression:", expression);
					return { success: false, error: "Unknown expression" };
				}

				console.log("Changing the expression from", currentExpression, "to", expression);

				if (duration <= 0) {
					for (const expr in currentVrm.expressionManager.expressionMap) {
						currentVrm.expressionManager.setValue(expr, 0.0);
					}
					currentVrm.expressionManager.setValue(expression, 1.0);
				} else {
					const startTime = performance.now();
					const startValues = {};
					
					for (const expr in currentVrm.expressionManager.expressionMap) {
						startValues[expr] = currentVrm.expressionManager.getValue(expr);
					}
					
					const animateTransition = (currentTime) => {
						const elapsed = (currentTime - startTime) / 1000;
						const progress = Math.min(elapsed / duration, 1.0);
						
						for (const expr in currentVrm.expressionManager.expressionMap) {
                            let targetValue = 0.0;
                            
                            if (expr === expression) {
                                targetValue = 0.85; 
                            } 

                            else if (expression === 'angry' && expr === 'surprised') {
                                targetValue = 0.15;
                            } 
                            else if (expression === 'happy' && expr === 'relaxed') {
                                targetValue = 0.20;
                            } 
                            else if (expression === 'sad' && expr === 'surprised') {
                                targetValue = 0.10;
                            }
                            else if (expression === 'surprised' && expr === 'relaxed') {
                                targetValue = 0.10;
                            }

                            const newValue = startValues[expr] + (targetValue - startValues[expr]) * progress;
                            currentVrm.expressionManager.setValue(expr, newValue);
                        }
						
						if (progress < 1.0) {
							requestAnimationFrame(animateTransition);
						}
					};
					
					requestAnimationFrame(animateTransition);
				}
				
				currentExpression = expression;
				return { success: true };
			}

			window.setAppState = function(state) {
				stateBias = state;
				console.log("[VRM] State changed to:", state);
				
				if (state === "PROCESSING") {
					isThinking = true;
					if (currentVrm && currentVrm.expressionManager) {
						currentVrm.expressionManager.setValue('blink', 0.15); 
					}
				} 
				else {
					isThinking = false;
					if (currentVrm && currentVrm.expressionManager) {
						currentVrm.expressionManager.setValue('blink', 0.0); 
					}
				}
			};

			window.setExpression = setExpression;

			function setMouthOpen(value) {
				if (VRM_OPTS.natural) { mouthTarget = Math.max(0, Math.min(1, value)); return; }
				if (!currentVrm || !currentVrm.expressionManager) return;
				
				const safeValue = Math.max(0.0, Math.min(1.0, value));
				
				currentVrm.expressionManager.setValue('aa', safeValue);

				if (safeValue > 0.05) {
					currentVrm.expressionManager.setValue('ih', 0);
					currentVrm.expressionManager.setValue('ou', 0);
					currentVrm.expressionManager.setValue('ee', 0);
					currentVrm.expressionManager.setValue('oh', 0);
				}
			}
			window.setMouthOpen = setMouthOpen;

			let jitterX = 0;
			let jitterY = 0;
			let idleExpressionTime = 0;
			
			function updateIdleJitter(deltaTime) {
				if (VRM_OPTS.natural) { return; }
				idleExpressionTime -= deltaTime;
				
				if (idleExpressionTime <= 0) {
					idleExpressionTime = 2.0 + Math.random() * 3.0;
					
					if (!isThinking && currentExpression === 'neutral') {
						if (Math.random() > 0.4) {
							jitterX = (Math.random() - 0.5) * 1.5;
							jitterY = (Math.random() - 0.5) * 1.0;
						} else {
							jitterX = 0;
							jitterY = 0;
						}

						if (currentVrm && currentVrm.expressionManager) {
							currentVrm.expressionManager.setValue('relaxed', 0);
							currentVrm.expressionManager.setValue('surprised', 0);
							currentVrm.expressionManager.setValue('sad', 0);
							
							const rand = Math.random();
							if (rand < 0.3) {
								currentVrm.expressionManager.setValue('relaxed', 0.15 + Math.random() * 0.1);
							} 
							else if (rand > 0.9) {
								currentVrm.expressionManager.setValue('surprised', 0.05 + Math.random() * 0.1);
							}
						}
					}
				}
			}

			async function loadFBX(animationUrl) {
				console.log("Trying to load an animation:", animationUrl);
				
				if (!window.vrmLoaded || !currentMixer) {
					console.error("The model or mixer is not ready");
					return { success: false, error: "The system is not ready" };
				}

				try {
					if (currentAction && !animationUrl.includes('neutral.fbx')) {
						currentAction.stop();
					}

					const clip = await loadMixamoAnimation(animationUrl, currentVrm);
					const newAction = currentMixer.clipAction(clip);

					newAction.clampWhenFinished = true;
					newAction.loop = THREE.LoopOnce;

					if (animationUrl === idleAnimationUrl) {
						idleAnimation = newAction;
						console.log("Idle animation is ready");
						newAction.loop = THREE.LoopRepeat;
					}

					if (animationUrl !== idleAnimationUrl) {
						const onFinish = () => {
							if (idleAnimation) {
								console.log("Return to idle animation");
								newAction.crossFadeTo(idleAnimation, 0.3, true);
								idleAnimation.play();
								currentAction = idleAnimation;
							}
							newAction.getMixer().removeEventListener('finished', onFinish);
						};
						newAction.getMixer().addEventListener('finished', onFinish);
					}

					newAction.reset().play();
					currentAction = newAction;
					
					return { success: true };
				} catch (error) {
					console.error("Animation loading error:", error);
					if (idleAnimation) {
						idleAnimation.reset().play();
						currentAction = idleAnimation;
					}
					return { success: false, error: error.message };
				}
			}
			window.loadFBX = loadFBX;

			window.updateLookAtTarget = function(x, y) {
				targetMouseX = x;
				targetMouseY = y;
			};

			window.setHeadAngle = function(angleX, angleY, angleZ) {
				if (!currentVrm || !currentVrm.humanoid) return;
				const head = currentVrm.humanoid.getNormalizedBoneNode('head');
				if (!head) return;
				head.rotation.y = THREE.MathUtils.degToRad(angleX);
				head.rotation.x = THREE.MathUtils.degToRad(-angleY);
				if (angleZ !== undefined) head.rotation.z = THREE.MathUtils.degToRad(angleZ);
			};

			window.setBodyAngle = function(angleX, angleZ) {
				if (!currentVrm || !currentVrm.humanoid) return;
				const spine = currentVrm.humanoid.getNormalizedBoneNode('spine');
				const chest = currentVrm.humanoid.getNormalizedBoneNode('chest');
				const upper = currentVrm.humanoid.getNormalizedBoneNode('upperChest');
				if (spine) spine.rotation.z = THREE.MathUtils.degToRad(-angleX * 0.5);
				if (chest) chest.rotation.z = THREE.MathUtils.degToRad(-angleX * 0.3);
				if (upper) upper.rotation.z = THREE.MathUtils.degToRad(-angleX * 0.2);
			};

			window.setEyeOpen = function(leftValue, rightValue) {
				if (!currentVrm || !currentVrm.expressionManager) return;
				const avg = (leftValue + rightValue) / 2;
				const blinkVal = 1.0 - Math.max(0.0, Math.min(1.0, avg));
				currentVrm.expressionManager.setValue('blink', blinkVal);
			};

			window.triggerBlink = function() {
				if (!currentVrm || !currentVrm.expressionManager) return;
				currentVrm.expressionManager.setValue('blink', 1.0);
				setTimeout(() => {
					if (currentVrm && currentVrm.expressionManager) {
						currentVrm.expressionManager.setValue('blink', 0.0);
					}
				}, 120);
			};

			// small idle gestures now and then (touch head, fix hair, stretch, ...); paused while she talks or an emotion animation plays
			const idleGestures = createIdleGestures({ THREE, getVrm: () => currentVrm,
				isBusy: () => isThinking || mouthCur > 0.12 || stateBias === 'PROCESSING' || !!isPlayingOneShot,
				intensity: () => (VRM_OPTS.gestures === false ? 0 : 1) });
			window.idleGestures = idleGestures;

			const clock = new THREE.Clock();
			function animate() {
				requestAnimationFrame( animate );
				const deltaTime = clock.getDelta();
				const time = clock.getElapsedTime();

				updateIdleJitter(deltaTime);

				const breathOffset = Math.sin(time * 1.5) * 0.1;
				
				let finalTargetX = (targetMouseX * 3.0) + jitterX;
				let finalTargetY = (targetMouseY * 2.0) + jitterY + breathOffset;

				if (isThinking) {
					finalTargetX = thinkSide * 4.0;
					finalTargetY = 3.0 + breathOffset;
				}

				lookAtTarget.position.x += (finalTargetX - lookAtTarget.position.x) * 5.0 * deltaTime;
				lookAtTarget.position.y += (finalTargetY - lookAtTarget.position.y) * 5.0 * deltaTime;
				lookAtTarget.position.z = -5.0;

				if ( currentMixer ) currentMixer.update( deltaTime );
				if ( currentVrm ) idleGestures.update( deltaTime, time );
				if ( currentVrm ) { updateNaturalExpr( deltaTime, time ); currentVrm.update( deltaTime ); updateNaturalBones( deltaTime, time ); }

				renderer.render( scene, camera );
			}

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
		</script>
	</body>
</html>
